<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>緑玉神社</title>
<style>
/* --- 1. デバイス全体の固定設定 --- */
body {
  -webkit-text-size-adjust: 100%;
  margin: 0;
  padding: 0;
  background: #000;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  width: 100vw;
  overflow: hidden; /* スクロール禁止 */
  position: fixed;  /* スマホのバウンス禁止  */
  touch-action: none; /* ブラウザ操作を無効化  */
}

/* --- 2. ゲーム画面の比率固定 --- */
#gameScreen {
  position: relative;
  aspect-ratio: 9 / 17;
  height: 95vh;     /* 画面の高さに合わせる */
  width: auto;
  max-width: 100vw;
  background: #fff;
  overflow: hidden; 
  border-radius: 10px;
  touch-action: none; /* ゲーム内操作を優先 [cite: 6] */
}
#resizeHandle {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 14%;      /* 掴みやすい太さ */
  background: linear-gradient(transparent, rgba(109, 103, 103, 2)); /* 視覚的なガイド */
  cursor: ns-resize; /* 上下リサイズのカーソル */
  z-index: 2000;
  display: flex;
  justify-content: center;
  align-items: center;
}

/* ハンドルの中央に「つまみ」の線を表示 */
#resizeHandle::after {
  content: "";
  width: 100px;
  height: 12px;
  background: #888;
  border-radius: 8px;
}

/* --- 3. 判定ゾーンのレスポンシブ化 --- */
/* --- 判定ゾーンをサッカーゴール風に --- */
/* --- 判定ゾーンをデバイス幅に左右されず端に固定 --- */
#badZone, #goodZone {
  position: absolute;
  bottom: 35%;
  width: 28%;          /* 画面幅の28%に固定 */
  height: 20%;         /* 高さも%にすると縦長デバイスでも安定します */
  border: 4px solid;
  border-bottom: none; 
  background: rgba(255, 255, 255, 0.2);
  z-index: 5;
}

#badZone { 
  left: -12%;             /* 左端にぴったり配置 */
  border-color: purple; 
  border-left: none;   /* 左側の線を消すとよりゴールっぽくなります */
  transform: rotate(-10deg);
  transform-origin: left bottom; /* 左下を軸に回転 */
}

#goodZone { 
  right: -12%;            /* 右端にぴったり配置 */
  border-color: red; 
  border-right: none;  /* 右側の線を消す */
  transform: rotate(10deg);
  transform-origin: right bottom; /* 右下を軸に回転 */
}
/* --- 4. 皿の位置を固定 --- */
#plate {
  position: absolute;
  bottom: 30%;
  left: 50%;
  transform: translateX(-50%);
  width: 55%;           /* 少し幅を広めに */
  height: 5%;         /* 台座の厚み */
  background: linear-gradient(to bottom, #e0e0e0, #bdbdbd); /* 前面のグラデーション */
  border-radius: 4px;
  z-index: 6;
  box-shadow: 0 10px 20px rgba(0,0,0,0.3); /* 下に落とす影 */
}
/* 台座の「上面（奥行き部分）」 */
#plate::before {
  content: "";
  position: absolute;
  top: -15px;           /* 厚みの分だけ上に配置 */
  left: 0;
  width: 100%;
  height: 45%;
  background: #b72596;  /* 上面は光が当たって明るい色 */
  transition: filter 0.3s ease; /* 色変化を滑らかに */
  overflow: hidden;
  border-radius: 4px 4px 0 0;
  transform: perspective(100px) rotateX(40deg); /* 奥行きを出すマジック */
}

/* 台座の「脚（下の支え部分）」 */
#plate::after {
  content: "";       /* 文字を入れる場合はここ */
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
  color: #757575;
  position: absolute;
  bottom: -100%;
  left: 15%;
  width: 70%;
  height: 100%;
  background: #9e9e9e;
  clip-path: polygon(10% 0%, 90% 0%, 100% 100%, 0% 100%); /* 台形にする */
}
#plateCrack {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  opacity:0; /* 最初は見えない */
  background-image: url('44.png'); /* ヒビ模様のテクスチャ */
  background-size: cover;
  mix-blend-mode: multiply; /* お皿の絵となじませる */
  transition: opacity 0.5s ease;
}
@keyframes shake {
  0% { margin-left: 0; }
  25% { margin-left: 2px; }
  50% { margin-left: -2px; }
  75% { margin-left: 2px; }
  100% { margin-left: 0; }
}

.shake-anime {
  /* positionが絶対配置でも影響しにくいmarginで震えさせます */
  animation: shake 0.1s infinite;
}
/* --- おみくじのサイズも調整 --- */
/* --- おみくじのサイズ固定 --- */
.omikuji {
  position: absolute;
  width: 11%;          /* 画面幅の22%に固定 */
  aspect-ratio: 1 / 1.5; /* 用意した画像の縦横比に合わせて調整（例：縦長 1 / 1.5） */
  z-index: 10;
  touch-action: none;   /* 操作を安定させる */
  
  /* --- 【ここを追加】画像の表示設定 --- */
  background-size: contain;      /* 画像全体が収まるように */
  background-repeat: no-repeat;  /* 繰り返さない */
  background-position: center;   /* 中央に配置 */
  background-color: transparent; /* 背景色は透明に（画像優先） */
  
  /* 画像の上に文字を表示する場合のスタイル */
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff; /* 文字色 */
  font-weight: bold;
  font-size: 1.5vh;


  /* ドラッグしやすくするため、タッチ時の挙動を制限 */
  touch-action: none;
  cursor: grab;
  /* 色が赤に固定されていたので、クラスで指定できるように変更 */

}
/* 文字選択と長押しメニューを完全に禁止 */
* {
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
}

.good { background-color: #ff4444; }
.bad { background-color: #4444ff; }

/* 売り切れ状態 */

<div id="gameScreen">
<div id="info" style="display: none;">

  </div>

  <div class="status-box center" id="timeContainer">
    <div id="time">60</div>
    <div id="missionTextDisplay" style="display: none;"></div>
  </div>

  <div class="status-box side">
    <div style="font-size:  clamp(16px, 1.9vh, 100px);">所持金</div>
    <div style="font-size:  clamp(16px, 2.0vh, 100px); font-weight: bold;">￥<span id="money">0</span></div>
  </div>
</div>

  <div id="shopContainer" style="display:none;">
    <div class="item-slot" id="item0" onclick="buyItem(0)">
      <div class="item-image"></div>
      <div class="item-price">￥0</div>
      <div class="item-level">Lv.0</div> 
    </div>
    <div class="item-slot" id="item1" onclick="buyItem(1)">
      <div class="item-image"></div>

    </div>

      <button id="endlessBtn" class="menu-btn">エンドレス</button>

      <button class="menu-btn">今はなし</button>

    <p>稼いだ額: ￥<span id="finalMoney">0</span></p>
  </div>

<script>


// 内部管理用変数
let timeLeft = PARAMS.gameTime;
let score = 0;
let gameInterval;
let fallInterval;
let dragging = null;


// --- モード選択のイベント ---
document.getElementById("startBtn").onclick = () => {
  isEndless = false; // 通常モード
  startSequence();
};

// 追加：エンドレスモードボタンのイベント
// HTMLに id="endlessBtn" がある前提です
document.getElementById("endlessBtn").onclick = () => {
  isEndless = true; // エンドレスモード有効
  startSequence();
};

// 共通の開始処理


let missionCompletedCount = 0; // エンドレス用
let gameTimerId = null;        // メインタイマー（一元管理）

function startSequence() {
  // --- 1. 要素の安全な取得チェック ---
  const ui = {
    modeSelect: document.getElementById("modeSelect"),
    info: document.getElementById("info"),
    shop: document.getElementById("shopContainer"),
    bad: document.getElementById("badZone"),
    good: document.getElementById("goodZone"),
    plate: document.getElementById("plate"),

    missionUI: document.getElementById("missionTextDisplay"),
    scoreLabel: document.getElementById("scoreLabel"),
    scoreVal: document.getElementById("score")
  };

  // 必須要素が1つでもなければエラーを出して止める（デバッグ用）
  for (let key in ui) {
    if (!ui[key]) {
      console.error(`エラー: ID "${key}" が見つかりません。HTMLを確認してください。`);
      return;
    }
  }

  // --- 2. 画面表示の初期化 ---
  ui.modeSelect.style.display = "none";
  ui.info.style.display = "flex";
  ui.shop.style.display = "flex";
  ui.bad.style.display = "block";
  ui.good.style.display = "block";
  ui.plate.style.display = "block";
shopResetCost = 2;
  // --- 3. モード別の設定 ---
  if (isEndless) {

    ui.missionUI.style.display = "block";
    ui.scoreLabel.textContent = "達成数";
    missionCompletedCount = 0;
    ui.scoreVal.textContent = "0";
    durability = 100;
    initEndlessMode(); // ミッションと耐久力をセット
  } else {

    ui.missionUI.style.display = "none";
    ui.scoreLabel.textContent = "入れた数";
    score = 0;
    ui.scoreVal.textContent = "0";
    timeLeft = 10; // 通常モードの初期秒数
      document.getElementById("time").textContent = timeLeft;
  }

  money = 0;
  document.getElementById("money").textContent = money;

  performReset();
  restartSpawnTimer();
  startGame(); // ここでカウントダウン開始
}

// エンドレスモードの初期化
function initEndlessMode() {
  durability = 100;
  // --- ここを追加 ---
  availableMissions = []; // ミッションの山札をクリア
  missionDifficultyMultiplier = 0; // 難易度倍率をリセット
  // -----------------
  update(); // UIを100%に更新2
  startNewMission(); // 最初のミッションをセット
}
// 例：カウントダウンタイマーのイメージ
function startGame() {
  // 古いタイマーがあれば確実に消す
  if (gameTimerId) clearInterval(gameTimerId);

  const timeDisplay = document.getElementById("time");

  gameTimerId = setInterval(() => {
    if (isEndless) {
      // --- エンドレスモード：ミッション残り時間をカウント ---
      missionTimer--;
      timeDisplay.textContent = missionTimer;
      
      if (missionTimer <= 0) {
        clearInterval(gameTimerId);
        endGame("ミッション失敗！");
      }
       update();
// 毎秒耐久値を減らす（皿の上にものがある場合）
    } else {
      // --- 通常モード：60秒からカウントダウン ---
      timeLeft--;
      timeDisplay.textContent = timeLeft;
      
      if (timeLeft <= 0) {
        clearInterval(gameTimerId);
        endGame(); // タイムアップ
      }
    }
  },Math.max(100, 1000-(missionDifficultyMultiplier-1)*50));
}
// --- タイムアップ時の処理 ---
function endGame(reason) {
  // 1. 全てのタイマーを止める
  if (spawnTimer) {
    clearInterval(spawnTimer);
    spawnTimer = null;
  }
  if (gameTimerId) {
    clearInterval(gameTimerId);
    gameTimerId = null;
  }
// --- 皿の見た目をリセット ---
durability = 100; // 耐久値リセット
  const plate = document.getElementById("plate");
  const crack = document.getElementById("plateCrack");
  
  if (plate) {
    plate.classList.remove("shake-anime"); // 震えを止める
    plate.style.filter = "none";           // 赤みを消す
  }
  if (crack) {
    crack.style.opacity = 0;               // ヒビを消す
  }

  //  リザルト画面のタイトル
  const resultTitle = document.querySelector("#resultScreen h2");
  if (resultTitle) {
    // 引数があればそれを使う、なければデフォルトの「業務終了」

function spawnOmikuji() {
  const gameScreen = document.getElementById("gameScreen");
  const omikuji = document.createElement("div");
  omikuji.className = "omikuji";
  
  // ランダムに選んだアイテムのID（種類）を保存しておく
  const typeIdx = Math.floor(Math.random() * ITEM_LIST.length);
  const typeId = ITEM_LIST[typeIdx].id; // "luck_daikichi" や "luck_kyo" など
  
  omikuji.dataset.type = typeId; // ここで種類を記憶！
// --- 【追加】最大数制限 (例: 50個まで) ---
  const currentCount = document.querySelectorAll('.omikuji').length;
  const MAX_OMIKUJI = 50; 

  if (currentCount >= MAX_OMIKUJI) {
    // すでに上限なら、今回は生成せずに終了する
    return;
  }
  // 基本のプール
  let pool = ["大吉", "吉", "中吉", "小吉", "末吉", "凶"];

  // 1. 大吉レベル：大吉のみを増やす
  for (let i = 0; i < gameState.itemLevels["luck_daikichi"] * 5; i++) {
    pool.push("大吉");
  }

  // 2. 吉レベル：大吉と凶以外（吉・中吉・小吉・末吉）を増やす
  for (let i = 0; i < gameState.itemLevels["luck_kichi"] * 2; i++) {
    pool.push("吉", "中吉", "小吉", "末吉");
  }

  // 3. 凶レベル：凶のみを極端に増やす
  for (let i = 0; i < gameState.itemLevels["luck_kyo"] * 5; i++) {
    pool.push("凶");
  }
  //console.log(pool);
  const typeName = pool[Math.floor(Math.random() * pool.length)];
  const config = OMIKUJI_TYPES[typeName];
  //console.log("生成されたおみくじの種類:", typeName);
  // 以降、描画処理...
  omikuji.className = "omikuji";
  omikuji.dataset.type = typeName;
  if (config.image) {
    omikuji.style.backgroundImage = `url(${config.image})`;
  } else {
    omikuji.style.backgroundColor = config.color;
    omikuji.textContent = typeName;
  }

  gameScreen.appendChild(omikuji);
  
  // --- 以下、座標計算とドラッグ処理 ---
  const screenWidth = gameScreen.clientWidth;
  const oWidth = omikuji.offsetWidth || (screenWidth * 0.22);
  const minLeft = screenWidth * 0.3; 
  const maxLeft = screenWidth * 0.7 - oWidth;
  omikuji.style.left = (Math.random() * (maxLeft - minLeft) + minLeft) + "px";
  omikuji.style.top = "-100px";
  let vx = 0; // 横速度
  let vy = 0; // 縦速度
  let isOnPlate = false;

  const fall = setInterval(() => {
    if (dragging === omikuji || isOnPlate) return;

    // 重力計算（PARAMSを使用） 
    vy += PARAMS.gravity;
    if (vy > PARAMS.maxFallSpeed) vy = PARAMS.maxFallSpeed;
    
    // 座標更新
    let x = parseFloat(omikuji.style.left) + vx;
    let y = parseFloat(omikuji.style.top) + vy;

    // 壁バウンド（画面幅に合わせて動的に判定） 
    if (x < 0) {
      x = 0;
      vx *= PARAMS.bounceLimit;
    } else if (x > screenWidth - oWidth) {
      x = screenWidth - oWidth;
      vx *= PARAMS.bounceLimit;
    }

    omikuji.style.left = x + "px";
    omikuji.style.top = y + "px";

    // 速度減衰（慣性） 
    vx *= PARAMS.friction;

    // 皿判定 
    if (checkPlate(omikuji)) {
      isOnPlate = true;
      vx = 0; vy = 0;
    }

    // ゴール判定 
    checkDrop(omikuji);

    // 画面外削除
    if (y > gameScreen.clientHeight) {
      clearInterval(fall);
      omikuji.remove();
    }
  }, 16);

  // --- ドラッグ＆はじく処理（中心点ズレ修正版） ---
// --- ドラッグ＆はじく処理 ---
  omikuji.onpointerdown = (e) => {
    e.preventDefault();
    dragging = omikuji;
    
    // 【修正】掴んだ瞬間にすべての状態をリセット
    isOnPlate = false; 
    vx = 0;
    vy = 0;
    
    // 見た目のフィードバックを消す
    omikuji.classList.remove("on-plate");
    omikuji.style.outline = "none";
    omikuji.style.boxShadow = "none";
    if (omikuji.dataset) omikuji.dataset.stillFrames = 0;

    omikuji.setPointerCapture(e.pointerId);

    let lastX = e.clientX;
    let lastY = e.clientY;

    const move = (ev) => {
      if (dragging !== omikuji) return;
      
      // 移動中は強制的にフラグを折り続ける
      isOnPlate = false;

      // 速度計算 
      vx = (ev.clientX - lastX) * PARAMS.tossPower;
      vy = (ev.clientY - lastY) * PARAMS.tossPower;
      lastX = ev.clientX;
      lastY = ev.clientY;

      const sRect = gameScreen.getBoundingClientRect();
      omikuji.style.left = (ev.clientX - sRect.left - (omikuji.offsetWidth / 2)) + "px";
      omikuji.style.top = (ev.clientY - sRect.top - (omikuji.offsetHeight / 2)) + "px";
    };
    
    const up = () => {
      document.removeEventListener("pointermove", move);
      document.removeEventListener("pointerup", up);
      
      // 【重要】離した瞬間に少しだけ勢いをつける、または自由落下を再開させる
      dragging = null;
    };
    
    document.addEventListener("pointermove", move);
    document.addEventListener("pointerup", up);
  };}

// --- 良い・悪いゾーンの判定 ---
let money = 0; // お金の変数を追加
function checkDrop(omikuji) {
  const rect = omikuji.getBoundingClientRect();
  const gameRect = document.getElementById("gameScreen").getBoundingClientRect();
  const goodGoal = document.getElementById("goodZone").getBoundingClientRect();
  const badGoal = document.getElementById("badZone").getBoundingClientRect();

  // dataset.type が空でないか確認（デバッグ用）
  const type = omikuji.dataset.type;

  if (!type) {
    console.error("エラー: おみくじに type が設定されていません！");
  }

  const config = OMIKUJI_TYPES[type];
  let earnedMoney = 0;
  let scored = false;

  if (isOverlap(rect, goodGoal)) {
    earnedMoney = config.goodPay;
    scored = true;
  } else if (isOverlap(rect, badGoal)) {
    earnedMoney = config.badPay;
    scored = true;
  }

if (scored) {
    const finalPay = Math.floor(earnedMoney * gameState.moneyMultiplier);
    money += finalPay;

    // --- ここがポイント：スコア加算 ---
    // モードに関わらず「入れた数」をカウントアップ
    score++; 
    
    // UIを更新（通常モードの左上の数字）
    const scoreElement = document.getElementById("score");
    if (scoreElement) {
      // エンドレスモード中なら「ミッション達成数」を表示しているはずなので
      // 通常モードの時だけ score を反映させる
      if (!isEndless) {
        scoreElement.textContent = score;
      }
    }

    document.getElementById("money").textContent = money;
    updateShopVisuals();

    // --- エンドレスモード用の追加判定 ---
 // --- エンドレスモード用の追加判定 ---
    if (isEndless) {
      const typeName = omikuji.dataset.type; // "大吉" "末吉" など
      const config = OMIKUJI_TYPES[typeName];

      // 1. 「大吉」「凶」以外を入れろ
      if (currentMission.type === "not_special") {
        if (typeName !== "大吉" && typeName !== "凶") {
          checkMissionProgress("not_special", 1);
        }
      }

      // 2. 20回入れろ（トータルカウント）
      else if (currentMission.type === "total_count") {
        checkMissionProgress("total_count", 1);
      }

      // 3. 正しい方（得する方）に入れろ
      else if (currentMission.type === "side_check") {
        // GoodZoneに入ったかどうか（earnedMoney が config.goodPay と等しいか）
        const putInGood = (earnedMoney === config.goodPay);
        
        // おみくじの性質判定：Goodの方が高い（大吉〜末吉）か、Badの方が高い（凶）か
        const isGoodBetter = config.goodPay >= config.badPay;

        // 【判定条件】
        // 「報酬が高いのがGood」かつ「Goodに入れた」 
        // または 「報酬が高いのがBad（凶など）」かつ「Badに入れた」
        if ((isGoodBetter && putInGood) || (!isGoodBetter && !putInGood)) {
          checkMissionProgress("side_check", 1);
        }
      }

      // 4. 既存の金額ミッションなど
      else if (currentMission.type === "money") {
        checkMissionProgress("money", finalPay);
      }
      
      // 5. 既存の特定の種類ミッション
      else {
        let missionType = "";
        if (typeName.includes("大吉")) missionType = "daikichi";
        else if (typeName.includes("凶")) missionType = "kyo";

        if (missionType !== "") {
          checkMissionProgress(missionType, 1);
        }
      }
    }

    // エフェクト表示と削除
    const relativeX = rect.left - gameRect.left + (rect.width / 2);
    const relativeY = rect.top - gameRect.top;
    const fontSize = Math.min(50, 10 + (finalPay / 777) * 100);
    showMoneyEffect(relativeX, relativeY, finalPay, fontSize);

    omikuji.remove();
  }
}
// 金額が浮き出る演出
function showMoneyEffect(x, y, amount, size) {
  const gameScreen = document.getElementById("gameScreen");
  const effect = document.createElement("div");
  
  effect.textContent = (amount >= 0 ? "+" : "") + amount;
  effect.className = "money-effect";
  
  // 位置と【サイズ】の設定
  effect.style.position = "absolute";
  effect.style.left = x + "px";
  effect.style.top = y + "px";
  effect.style.fontSize = size + "px"; // 動的なサイズ適用
  
  // 金額が大きいほど色を豪華にする演出（オプション）
  if (amount >= 777) {
    effect.style.color = "#7fffd4"; // ラッキーセブンは特別色
    effect.style.textShadow = "0 0 10px #fff, 0 0 20px #ff00ff";
  } else {
    effect.style.color = amount > 0 ? "#eaff00" : "#7dffa6";
  }
  
  effect.style.zIndex = 200;
  gameScreen.appendChild(effect);
  
  effect.addEventListener('animationend', () => {
    effect.remove();
  });
}

function isOverlap(a, b) {
  return !(a.right < b.left || a.left > b.right || a.bottom < b.top || a.top > b.bottom);
}

// --- 皿の判定 ---
// 皿判定の修正（タイマーを止めずに、乗っているフラグを返すだけにする）
function checkPlate(omikuji) {
  const plate = document.getElementById("plate").getBoundingClientRect();
  const rect = omikuji.getBoundingClientRect();
  const centerX = rect.left + rect.width / 2;
  const centerY = rect.bottom; // おみくじの下端で判定

  const onPlate =
    centerX > plate.left &&
    centerX < plate.right &&
    centerY >= plate.top &&
    centerY <= plate.bottom;

  if (onPlate) {
    // 皿の表面にピタッと合わせる
    const screenRect = document.getElementById("gameScreen").getBoundingClientRect();
    omikuji.style.top = (plate.top - screenRect.top - rect.height) + "px";
    return true;
  }

  return false;
}

function buyItem(index) {
  const item = currentItems[index];
  const id = item.id;
  const currentLv = gameState.itemLevels[id] || 0;

  // 1. 購入制限チェック
  if (currentLv >= 3 || item.soldOut) return;

    money -= item.price;
    
    // 2. 自身のレベルを上げる
    gameState.itemLevels[id]++;

    handleExclusion(id);

    item.soldOut = true;

    // 5. お金の表示を更新
    document.getElementById("money").textContent = money;

    // 6. 【ここが解決策】ショップに並んでいる全スロットの見た目を最新状態にする
    refreshShopUI(); 
    
    // 7. 効果を即反映
    applyItemEffect(id, gameState.itemLevels[id]);
    // 購入成功処理の後
  if (isEndless && currentMission.type === "shop_action") {
    checkMissionProgress("shop_action", 1);
  }
  }
}
function refreshShopUI() {

    const slot = document.getElementById(`item${i}`);

    // レベル表示を最新にする

  updateShopVisuals();

// 排他ロジックを整理

function handleExclusion(id) {
  let targetId = null;

  // 降る量のペア
  if (id === "spawn_up") targetId = "spawn_down";
  if (id === "spawn_down") targetId = "spawn_up";

  // 運勢のペア（大吉・吉・凶）
  if (id === "luck_daikichi") {
    gameState.itemLevels["luck_kichi"] = Math.max(0, gameState.itemLevels["luck_kichi"] - 1);
    gameState.itemLevels["luck_kyo"] = Math.max(0, gameState.itemLevels["luck_kyo"] - 1);
    applyItemEffect("luck_kichi", gameState.itemLevels["luck_kichi"]);
    applyItemEffect("luck_kyo", gameState.itemLevels["luck_kyo"]);
  }else if (id === "luck_kichi") {
     gameState.itemLevels["luck_daikichi"] = Math.max(0, gameState.itemLevels["luck_daikichi"] - 1);
      gameState.itemLevels["luck_kyo"] = Math.max(0, gameState.itemLevels["luck_kyo"] - 1);
          applyItemEffect("luck_daikichi", gameState.itemLevels["luck_daikichi"]);
    applyItemEffect("luck_kyo", gameState.itemLevels["luck_kyo"]);
    } else if (id === "luck_kyo") {
      gameState.itemLevels["luck_daikichi"] = Math.max(0, gameState.itemLevels["luck_daikichi"] - 1);
      gameState.itemLevels["luck_kichi"] = Math.max(0, gameState.itemLevels["luck_kichi"] - 1);
          applyItemEffect("luck_kichi", gameState.itemLevels["luck_kichi"]);
    applyItemEffect("luck_daikichi", gameState.itemLevels["luck_daikichi"]);
    }
  // ...吉、凶の場合も同様に書く...

  if (targetId) {
    gameState.itemLevels[targetId] = Math.max(0, gameState.itemLevels[targetId] - 1);
    // レベルが下がった方の効果も即座に再計算して反映
    applyItemEffect(targetId, gameState.itemLevels[targetId]);
  }
}

function applyItemEffect(id, level) {
  console.log(`効果適用：${id}, レベル：${level}`);

  switch(id) {
    // 降る量に関連するIDなら、両方のレベルを考慮して間隔を再計算
    case "spawn_up":
    case "spawn_down":
      const upLv = gameState.itemLevels["spawn_up"] || 0;
      const downLv = gameState.itemLevels["spawn_down"] || 0;
      
      // 基本1200ms。アップ1につき-300ms、ダウン1につき+500ms
      // (例: アップLv1, ダウンLv0 => 900ms)
      // (例: アップLv1, ダウンLv1 => 1400ms ※打ち消し合いが起こるのでこのケースは基本ないはず)
      let newInterval = 1200 - (upLv * 300) + (downLv * 500);
      
      // 速すぎ・遅すぎの制限
      gameState.spawnInterval = Math.max(200, Math.min(3000, newInterval));
      
      console.log(`新しい降る間隔: ${gameState.spawnInterval}ms`);
      restartSpawnTimer(); // 即座に新しい間隔で再始動
      break;

    case "money":
      gameState.moneyMultiplier = 1 + (level * 0.5);
      break;
      
    // 運勢系は spawnOmikuji 側がレベルを直接参照するのでここではログのみ
    case "luck_daikichi":
    case "luck_kichi":
    case "luck_kyo":
      break;
  }
}
function resetAllItemLevels() {
  // すべてのアイテムIDを0にリセット
  const ids = ["spawn_up", "spawn_down", "money", "luck_daikichi", "luck_kichi", "luck_kyo"];
  ids.forEach(id => {
    gameState.itemLevels[id] = 0;
  });

  // 倍率や間隔も初期値に戻す
  gameState.moneyMultiplier = 1;
  gameState.spawnInterval = 1200;
  
  console.log("アイテムレベルをすべてリセットしました");
}


function update() {
  const omikujis = document.querySelectorAll(".omikuji");

  omikujis.forEach((omikuji) => {
    // 1. 速度を取得
    const vy = parseFloat(omikuji.dataset.vy || 0); 
    const vx = parseFloat(omikuji.dataset.vx || 0);
    
    // 2. 現在ドラッグ中かどうかのフラグを確認（既存の変数名に合わせてください）
    // もし omikuji.isDragging のようなフラグがあればそれを使います
    const isDragging = omikuji.style.zIndex === "1000"; // ドラッグ中はおそらく zIndex を上げているはず

    // 「速度がほぼ0」かつ「マウスで掴んでいない」場合のみ「静止（皿の上）」とみなす
    if (Math.abs(vy) < 0.1 && Math.abs(vx) < 0.1 && !isDragging) {
      let stillFrames = parseInt(omikuji.dataset.stillFrames || 0);
      stillFrames++;
      omikuji.dataset.stillFrames = stillFrames;

      if (stillFrames > 3) {
        omikuji.classList.add("on-plate");
      }
    } else {
      // 弾いた（速度が出た）瞬間や、掴んだ瞬間に即座に解除
      omikuji.dataset.stillFrames = 0;
      omikuji.classList.remove("on-plate");
      
      // スタイルをリセット
      omikuji.style.outline = "none";
      omikuji.style.boxShadow = "none";
      omikuji.style.filter = "none";
    }
  });

  if (isEndless) {
    calculateDurability();
     
  }
}
function calculateDurability() {
  const onPlateItems = document.querySelectorAll(".on-plate");
  const count = onPlateItems.length;

  // 1つ以上乗っているなら耐久力を減らす
  if (count > 0) {
    // 減少スピードを調整（必要に応じて数値を変更）
    durability -= count * 0.4;

    if (durability <= 0) {
      durability = 0;
      endGame("皿が壊れました！");
    }
    updateDurabilityUI();
  }
  checkKeepMission();
}
// --- 耐久値を更新する関数 ---

function updateDurabilityUI() {
  const plate = document.getElementById("plate");
  const crack = document.getElementById("plateCrack");
  if (!plate) return;

  // 100から現在の耐久を引いた「ダメージ率」を計算
  const damage = 100 - durability; 

  // ダメージに応じて赤くする
 // 元の水色を消しながら赤を強くする設定例
plate.style.filter = `brightness(${1 - damage/200}) saturate(${100 + damage * 4}%) hue-rotate(${damage * 1.5}deg) sepia(${damage}%)`;
// 2. ヒビの濃さ (50%を切ったら徐々にヒビが見えてくる)
  if (crack) {
    if (damage > 30) {
      // 30%以上のダメージでヒビが出現
      crack.style.opacity = (damage - 30) / 70; 
    } else {
      crack.style.opacity = 0;
    }
  }
  // 20%以下（ダメージ80以上）で震える
  if (durability <= 20) {
    plate.classList.add("shake-anime");
  } else {
    plate.classList.remove("shake-anime");
  }
}

// --- 皿のミッションの進捗をチェックする関数 ---
let keepTimer = 0; // 関数の外で定義

function checkKeepMission() {
  // 安全装置
// 1. 安全装置：currentMission が「定義されているか」かつ「nullでないか」をチェック
  if (typeof currentMission === "undefined" || currentMission === null) {
    keepTimer = 0;
    console.log("currentMission が定義されていません");
    return;
  }

  // 2. ミッションの種類が keep_limit 以外なら何もしない
  if (currentMission.type !== "keep_limit") {
    keepTimer = 0;
   // console.log("keep_limit 以外のミッション");
    return;
  }
  const count = document.querySelectorAll(".on-plate").length;
  
  // 1個以上、かつ10個以下の場合
  if (count >= 0 && count <= 10) {
    keepTimer +=1000; // 毎フレーム(約16.6ms)加算
    console.log("keepTimer", keepTimer);
    // 1000ms（1秒）経過したら
    if (keepTimer >= 1000) {
      // 進捗を「1」増やす（これが画面上の「1/5」の「1」になります）
      checkMissionProgress("keep_limit", 1); 
      keepTimer = 0; // 次の1秒のためにリセット
      
      // デバッグ用：動いているかコンソールで確認
      console.log("1秒キープ成功！現在の進捗:", missionProgress);
    }
  } else {
    // 範囲外（0個または11個以上）になったらタイマーをリセット
    // ※「連続」で5秒ならリセットでOK。「累計」で5秒ならここを消します。
    keepTimer = 0; 
  }
}

function startNewMission() {
// 1. 山札が空、または存在しない場合は全ミッションを補充
  if (availableMissions.length === 0) {
    console.log("山札が空のため全ミッションを補充します");
    availableMissions = MISSIONS.slice(); // 全リストをコピー
    // フィッシャー–イェーツのシャッフル（よりランダムにする場合）
    for (let i = availableMissions.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [availableMissions[i], availableMissions[j]] = [availableMissions[j], availableMissions[i]];
    }
    missionDifficultyMultiplier += 1;
    console.log("シャッフル", missionDifficultyMultiplier);
  }

  // 2. 山札から一つ取り出す（pop）
  const selected = availableMissions.pop();

  // 3. 難易度を計算して適用（達成数に応じてターゲットを増やす）

  currentMission = { ...selected };
  // 4. 次回のために難易度倍率を少し上げる（例: 1ミッションごとに5%アップ）
  if (currentMission.type == "keep_limit") {
    currentMission.count = Math.min(Math.ceil(selected.count +missionDifficultyMultiplier),10);
  }if (currentMission.type == "shop_action") {
        currentMission.count = Math.min(Math.ceil(selected.count +missionDifficultyMultiplier/2),8);
  } else {
    currentMission.count = Math.ceil((selected.count+missionCompletedCount) * missionDifficultyMultiplier*0.1); // 0.1;
  }
    
    
  
console.log("スコア", missionCompletedCount, "難易度", currentMission.count);

//
  missionProgress = 0;
  missionTimer = selected.time;
  

  keepTimer = 0;       // タイマーリセット（これを追加）

  document.getElementById("time").textContent = missionTimer;
  const missionDisplay = document.getElementById("missionTextDisplay");
  missionDisplay.style.display = "block";
  updateMissionText();
}

// テキスト更新用
function updateMissionText() {
  const missionDisplay = document.getElementById("missionTextDisplay");
  missionDisplay.textContent = `${currentMission.text} (${missionProgress}/${currentMission.count})`;
}

// ミッション進捗時にテキストを更新
function checkMissionProgress(type, value = 1) {
  if (!isEndless || !currentMission) {
    //console.log("ミッション判定スキップ: Endlessでないか、ミッションがありません");
    return;
  }

  //console.log(`ミッション判定中: ターゲット=${currentMission.type}, 入力=${type}, 値=${value}`);
  if (currentMission.type === type) {
    if (type === "money") {
      missionProgress += value;
    } else {
      missionProgress += 1;
    }
    
   // console.log(`進捗更新: ${missionProgress} / ${currentMission.count}`);
    updateMissionText();

    if (missionProgress >= currentMission.count) {
      console.log("ミッションクリア！");
      completeMission();
    }
  }
}

function completeMission() {
  durability = 100; // 回復
  missionCompletedCount++; // 達成数をカウント
  
  // 画面の数値を更新
  document.getElementById("score").textContent = missionCompletedCount;
  // ミッションクリアのエフェクト
  showMoneyEffect(window.innerWidth/2, window.innerHeight/2, "MISSION CLEAR!", 40);
  startNewMission(); 
}

// --- リサイズ処理 ---
const gameScreen = document.getElementById("gameScreen");
const resizeHandle = document.getElementById("resizeHandle");

let isResizing = false;

// --- マウス・タッチ開始 ---
const startResize = (e) => {
  isResizing = true;
  document.body.style.cursor = "ns-resize";
  e.preventDefault();
};

// --- 移動中 ---
const doResize = (e) => {
  if (!isResizing) return;

  // タッチ操作とマウス操作の両方に対応
  const clientY = e.touches ? e.touches[0].clientY : e.clientY;
  
  // gameScreenの上端からの距離を計算して高さに設定
  const rect = gameScreen.getBoundingClientRect();
  const newHeight = clientY - rect.top;

  // 最小・最大制限を守りつつ反映
  if (newHeight > 450 && newHeight < window.innerHeight * 1.1) {
    gameScreen.style.height = newHeight + "px";
  }
};

// --- 終了 ---
const stopResize = () => {
  isResizing = false;
  document.body.style.cursor = "default";
};

// イベント登録
resizeHandle.addEventListener("mousedown", startResize);
resizeHandle.addEventListener("touchstart", startResize);

window.addEventListener("mousemove", doResize);
window.addEventListener("touchmove", doResize, { passive: false });

window.addEventListener("mouseup", stopResize);
window.addEventListener("touchend", stopResize);
</script>
