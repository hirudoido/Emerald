<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>緑玉神社</title>
<style>
/* --- 1. デバイス全体の固定設定 --- */
body {
  margin: 0;
  padding: 0;
  background: #000;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  width: 100vw;
  overflow: hidden; /* スクロール禁止 */
  position: fixed;  /* スマホのバウンス禁止  */
  touch-action: none; /* ブラウザ操作を無効化  */
}

/* --- 2. ゲーム画面の比率固定 --- */
#gameScreen {
  position: relative;
  aspect-ratio: 9 / 17;
  height: 95vh;     /* 画面の高さに合わせる */
  width: auto;
  max-width: 100vw;
  background: #fff;
  overflow: hidden; 
  border-radius: 10px;
  touch-action: none; /* ゲーム内操作を優先 [cite: 6] */
}

/* --- 3. 判定ゾーンのレスポンシブ化 --- */
/* --- 判定ゾーンをサッカーゴール風に --- */
/* --- 判定ゾーンをデバイス幅に左右されず端に固定 --- */
#badZone, #goodZone {
  position: absolute;
  bottom: 35%;
  width: 28%;          /* 画面幅の28%に固定 */
  height: 20%;         /* 高さも%にすると縦長デバイスでも安定します */
  border: 4px solid;
  border-bottom: none; 
  background: rgba(255, 255, 255, 0.2);
  z-index: 5;
}

#badZone { 
  left: -12%;             /* 左端にぴったり配置 */
  border-color: purple; 
  border-left: none;   /* 左側の線を消すとよりゴールっぽくなります */
  transform: rotate(-10deg);
  transform-origin: left bottom; /* 左下を軸に回転 */
}

#goodZone { 
  right: -12%;            /* 右端にぴったり配置 */
  border-color: red; 
  border-right: none;  /* 右側の線を消す */
  transform: rotate(10deg);
  transform-origin: right bottom; /* 右下を軸に回転 */
}
/* --- 4. 皿の位置を固定 --- */
#plate {
  position: absolute;
  bottom: 30%;
  left: 50%;
  transform: translateX(-50%);
  width: 55%;           /* 少し幅を広めに */
  height: 5%;         /* 台座の厚み */
  background: linear-gradient(to bottom, #e0e0e0, #bdbdbd); /* 前面のグラデーション */
  border-radius: 4px;
  z-index: 6;
  box-shadow: 0 10px 20px rgba(0,0,0,0.3); /* 下に落とす影 */
}
/* 台座の「上面（奥行き部分）」 */
#plate::before {
  content: "";
  position: absolute;
  top: -15px;           /* 厚みの分だけ上に配置 */
  left: 0;
  width: 100%;
  height: 15px;
  background: #824242;  /* 上面は光が当たって明るい色 */
  border-radius: 4px 4px 0 0;
  transform: perspective(100px) rotateX(40deg); /* 奥行きを出すマジック */
}

/* 台座の「脚（下の支え部分）」 */
#plate::after {
  content: "皿";       /* 文字を入れる場合はここ */
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
  color: #757575;
  position: absolute;
  bottom: -100%;
  left: 15%;
  width: 70%;
  height: 100%;
  background: #9e9e9e;
  clip-path: polygon(10% 0%, 90% 0%, 100% 100%, 0% 100%); /* 台形にする */
}
/* --- おみくじのサイズも調整 --- */
/* --- おみくじのサイズ固定 --- */
.omikuji {
  position: absolute;
  width: 11%;          /* 画面幅の22%に固定 */
  aspect-ratio: 1 / 1.5; /* 用意した画像の縦横比に合わせて調整（例：縦長 1 / 1.5） */
  z-index: 10;
  touch-action: none;   /* 操作を安定させる */
  
  /* --- 【ここを追加】画像の表示設定 --- */
  background-size: contain;      /* 画像全体が収まるように */
  background-repeat: no-repeat;  /* 繰り返さない */
  background-position: center;   /* 中央に配置 */
  background-color: transparent; /* 背景色は透明に（画像優先） */
  
  /* 画像の上に文字を表示する場合のスタイル */
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff; /* 文字色 */
  font-weight: bold;
  font-size: 1.5vw;
}
/* 文字選択と長押しメニューを完全に禁止 */
* {
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
}
.omikuji {
  /* ドラッグしやすくするため、タッチ時の挙動を制限 */
  touch-action: none;
  cursor: grab;
  /* 色が赤に固定されていたので、クラスで指定できるように変更 */
}
.good { background-color: #ff4444; }
.bad { background-color: #4444ff; }


#gameScreen {
  position: relative;
  aspect-ratio: 9 / 17; /* 比率を9:17に固定  */
  height: 95vh;
  background: #fff;
  overflow: hidden;
  border-radius: 10px;
}

#modeSelect {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-color: #ffccaa; /* お手本に近いオレンジ色 */
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  z-index: 100;
}

.menu-container {
  display: flex;
  flex-direction: column;
  gap: 20px;
  width: 80%;
}

.menu-btn {
  padding: 15px 0;
  font-size: 1.2rem;
  font-weight: bold;
  background: #fff;
  border: 2px solid #2e7d32; /* 緑の枠線 */
  border-radius: 8px;
  cursor: pointer;
}
  /* --- おみくじの情報表示 --- */
#info {
  /* 親の #gameScreen を基準にする */
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 6%; /* 少し高さを出すとバランスが良いです */
  display: flex;
  justify-content: space-around;
  align-items: center;
  background: rgba(0, 0, 0, 0.7); /* 少し濃いめの半透明黒 */
  color: #fff;
  z-index: 110; /* モード選択や皿よりも上に表示 */
  border-bottom: 2px solid #ffcc00; /* 下に金色の線を引くと神社っぽくなります */
}

/* 各項目の調整 */
.info-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  flex: 1;
}

.label {
  font-size: 2%;
  color: #ffcc00;
  font-weight: bold;
}

#time, #money, #score {
  font-family: 'Courier New', Courier, monospace; /* 数字を等幅にするとガタつきません */
}
#shopContainer {
  position: absolute;
  bottom: 2%;         /* 画面の一番下から2%の位置 */
  left: 50%;
  transform: translateX(-50%);
  width: 95%;         /* 横幅いっぱい */
  display: none;      /* JSでflexに切り替える */
  justify-content: center;
  gap: 15px;          /* アイテム間の隙間 */
  z-index: 200;       /* 皿やゾーンよりも手前に */
  pointer-events: auto; /* クリックを有効に */
}

.item-slot {
  width: 80px;
  height: 100px;
  background: rgba(255, 255, 255, 0.9);
  border: 3px solid #ccc;
  border-radius: 10px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-around;
}

/* 買える時に光る演出 */
/* 買える時に光る演出（より目立たせる） */
.item-slot.can-buy {
  border-color: #1eff00;
  box-shadow: 0 0 20px #3eb752;
  background: rgb(187, 255, 174); /* 背景も少し黄色く */
  animation: pulse 1.0s infinite ease-in-out; /* 1.5sから1.0sに速く */
}

@keyframes pulse {
  0% { transform: scale(1); box-shadow: 0 0 5px #00ff2f; }
  50% { transform: scale(1.08); box-shadow: 0 0 25px #00ff2f; }
  100% { transform: scale(1); box-shadow: 0 0 5px #00ff2f; }
}

/* 売り切れ状態 */
.item-slot.sold-out {
  background: #555 !important;
  box-shadow: none !important;
  animation: none !important;
  pointer-events: none;
}
.item-slot.sold-out::after {
  content: "SOLD OUT";
  color: red;
  font-weight: bold;
  font-size: 10px;
}

#resetBtn {
  padding: 10px;
  background: #ff4444;
  color: white;
  border: none;
  border-radius: 5px;
  font-weight: bold;
}
</style>
</head>
<body>
<div id="gameScreen">
  <div id="info" style="display:none;">
    <div class="info-item">
      <span class="label">￥</span>
      <span id="money">0</span>
    </div>
    <div class="info-item timer">
      <span id="time">30</span>
    </div>
    <div class="info-item">
      <span class="label">数</span>
      <span id="score">0</span>
    </div>
  </div>
  <div id="shopContainer" style="display:none;">
    <div class="item-slot" id="item0" onclick="buyItem(0)">
      <div class="item-image"></div>
      <div class="item-price">￥0</div>
    </div>
    <div class="item-slot" id="item1" onclick="buyItem(1)">
      <div class="item-image"></div>
      <div class="item-price">￥0</div>
    </div>
    <button id="resetBtn" onclick="resetShop()">更新</button>
  </div>
<!-- モード選択画面 -->

  <div id="modeSelect">
    <div class="menu-container">
      <button class="menu-btn">エンドレス</button>
      <button id="startBtn" class="menu-btn">スタート</button>
      <button class="menu-btn">今はなし</button>
    </div>
  </div>


  <div id="badZone" style="display:none;">悪い</div>
  <div id="goodZone" style="display:none;">良い</div>
  <div id="plate" style="display:none;"></div>


</div>

<script>
  // ==========================================
//   ゲームバランス調整用パラメータ
// ==========================================
// --- ゲームバランス調整用 ---
const PARAMS = {
  gravity: 0.5,          // 重力（落下の加速速度）
  maxFallSpeed: 7,        // 最大落下速度（リミッター）
  friction: 0.99,         // 空気抵抗（はじいた後の減速比。1に近づくほど止まらない）
  tossPower: 1.0005,         // はじく強さの倍率
  bounceLimit: -0.1,      // 壁に当たった時の跳ね返り係数
  gameTime: 30            // 制限時間（秒）
};

// 内部管理用変数
let timeLeft = PARAMS.gameTime;
let score = 0;
let gameInterval;
let fallInterval;
let dragging = null;


document.getElementById("startBtn").onclick = () => {
  // すでにゲームが始まっていたら何もしない（連打防止）
  if (spawnTimer !== null) return; 

  document.getElementById("modeSelect").style.display = "none";
  document.getElementById("info").style.display = "flex";
  document.getElementById("shopContainer").style.display = "flex";
  
  // 各要素の表示
  document.getElementById("badZone").style.display = "block";
  document.getElementById("goodZone").style.display = "block";
  document.getElementById("plate").style.display = "block";

  resetShop();
  
  // 初期の間隔を設定してタイマー起動
  gameState.spawnInterval = 1200; 
  restartSpawnTimer(); 
  
  startGame(); // タイムカウントダウンなど
};

function startGame() {
  gameInterval = setInterval(() => {
    timeLeft--;
    document.getElementById("time").textContent = timeLeft;
    if (timeLeft <= 0) endGame();
  }, 1000);

}

function endGame() {
  clearInterval(gameInterval);
  clearInterval(fallInterval);
  alert("ゲーム終了！ 入れた数：" + score);
}


// おみくじの種類と報酬の設定
// ==========================================
//   おみくじの種類・報酬・画像設定
// ==========================================
const OMIKUJI_TYPES = {
  '大吉': { color: '#ff1111', goodPay: 50, badPay: 0,  image: '1.png' },
  '吉':   { color: '#ff8800', goodPay: 30, badPay: 5,  image: '2.png' },
  '中吉': { color: '#ffcc00', goodPay: 20, badPay: 10, image: '3.png' },
  '小吉': { color: '#88ff00', goodPay: 15, badPay: 5,  image: '4.png' },
  '末吉': { color: '#00ffcc', goodPay: 10, badPay: 2,  image: '5.png' },
  '凶':   { color: '#555555', goodPay: 0,  badPay: 20, image: '6.png' }
};
// ==========================================


function spawnOmikuji() {
  const gameScreen = document.getElementById("gameScreen");
  const omikuji = document.createElement("div");

  // 基本の抽選プール
  let pool = ["大吉", "吉", "中吉", "小吉", "末吉", "凶"];

  // アイテムレベルに応じて特定の運勢をプールに増やす
  for (let i = 0; i < gameState.luckGoodLevel * 3; i++) {
    pool.push("大吉", "吉");
  }
  for (let i = 0; i < gameState.luckBadLevel * 3; i++) {
    pool.push("凶");
  }
console.log(5);
  const typeName = pool[Math.floor(Math.random() * pool.length)];
  const config = OMIKUJI_TYPES[typeName];

  omikuji.className = "omikuji";
  omikuji.dataset.type = typeName;
  
  // 画像の設定（config.imageがある場合）
  if (config.image) {
    omikuji.style.backgroundImage = `url(${config.image})`;
  } else {
    omikuji.style.backgroundColor = config.color;
    omikuji.textContent = typeName;
  }

  gameScreen.appendChild(omikuji);
  
  // --- 以下、座標計算とドラッグ処理 ---
  const screenWidth = gameScreen.clientWidth;
  const oWidth = omikuji.offsetWidth || (screenWidth * 0.22);
  const minLeft = screenWidth * 0.3; 
  const maxLeft = screenWidth * 0.7 - oWidth;
  omikuji.style.left = (Math.random() * (maxLeft - minLeft) + minLeft) + "px";
  omikuji.style.top = "-100px";
  let vx = 0; // 横速度
  let vy = 0; // 縦速度
  let isOnPlate = false;

  const fall = setInterval(() => {
    if (dragging === omikuji || isOnPlate) return;

    // 重力計算（PARAMSを使用） 
    vy += PARAMS.gravity;
    if (vy > PARAMS.maxFallSpeed) vy = PARAMS.maxFallSpeed;
    
    // 座標更新
    let x = parseFloat(omikuji.style.left) + vx;
    let y = parseFloat(omikuji.style.top) + vy;

    // 壁バウンド（画面幅に合わせて動的に判定） 
    if (x < 0) {
      x = 0;
      vx *= PARAMS.bounceLimit;
    } else if (x > screenWidth - oWidth) {
      x = screenWidth - oWidth;
      vx *= PARAMS.bounceLimit;
    }

    omikuji.style.left = x + "px";
    omikuji.style.top = y + "px";

    // 速度減衰（慣性） 
    vx *= PARAMS.friction;

    // 皿判定 
    if (checkPlate(omikuji)) {
      isOnPlate = true;
      vx = 0; vy = 0;
    }

    // ゴール判定 
    checkDrop(omikuji);

    // 画面外削除
    if (y > gameScreen.clientHeight) {
      clearInterval(fall);
      omikuji.remove();
    }
  }, 16);

  // --- ドラッグ＆はじく処理（中心点ズレ修正版） ---
  omikuji.onpointerdown = (e) => {
    e.preventDefault();
    dragging = omikuji;
    isOnPlate = false;
    omikuji.setPointerCapture(e.pointerId);

    let lastX = e.clientX;
    let lastY = e.clientY;

    const move = (ev) => {
      if (dragging !== omikuji) return;
      
      // 速度計算 
      vx = (ev.clientX - lastX) * PARAMS.tossPower;
      vy = (ev.clientY - lastY) * PARAMS.tossPower;
      lastX = ev.clientX;
      lastY = ev.clientY;

      const sRect = gameScreen.getBoundingClientRect();
      
      // 指の真ん中におみくじが来るように計算 
      omikuji.style.left = (ev.clientX - sRect.left - (omikuji.offsetWidth / 2)) + "px";
      omikuji.style.top = (ev.clientY - sRect.top - (omikuji.offsetHeight / 2)) + "px";
    };

    const up = () => {
      document.removeEventListener("pointermove", move);
      document.removeEventListener("pointerup", up);
      dragging = null;
    };
    
    document.addEventListener("pointermove", move);
    document.addEventListener("pointerup", up);
  };
}
// --- 良い・悪いゾーンの判定 ---
let money = 0; // お金の変数を追加

function checkDrop(omikuji) {

  const rect = omikuji.getBoundingClientRect();
  const goodGoal = document.getElementById("goodZone").getBoundingClientRect();
  const badGoal = document.getElementById("badZone").getBoundingClientRect();
  
  const typeName = omikuji.dataset.type;
  const config = OMIKUJI_TYPES[typeName];
  let earnedMoney = 0;
  let scored = false;

  // 「良い方」に入った場合
  if (isOverlap(rect, goodGoal)) {
    earnedMoney = config.goodPay;
    scored = true;
  } 
  // 「悪い方」に入った場合
  else if (isOverlap(rect, badGoal)) {
    earnedMoney = config.badPay;
    scored = true;
  }

if (scored) {
    // 倍率を適用して計算
    const finalPay = Math.floor(earnedMoney * gameState.moneyMultiplier);
    money += finalPay;
    score++;
    
    document.getElementById("money").textContent = money;
    updateShopVisuals();
    showMoneyEffect(rect.left, rect.top, finalPay);
    omikuji.remove();
  }
}

// 金額が浮き出る演出
function showMoneyEffect(x, y, amount) {
  const effect = document.createElement("div");
  effect.textContent = "+" + amount;
  effect.style.position = "absolute";
  effect.style.left = x + "px";
  effect.style.top = y + "px";
  effect.style.color = amount > 0 ? "#ffcc00" : "#ff4444";
  effect.style.fontWeight = "bold";
  effect.style.zIndex = 200;
  effect.animate([
    { transform: 'translateY(0)', opacity: 1 },
    { transform: 'translateY(-50px)', opacity: 0 }
  ], { duration: 800 });
  
  document.getElementById("gameScreen").appendChild(effect);
  setTimeout(() => effect.remove(), 800);
}

function isOverlap(a, b) {
  return !(a.right < b.left || a.left > b.right || a.bottom < b.top || a.top > b.bottom);
}

// --- 皿の判定 ---
// 皿判定の修正（タイマーを止めずに、乗っているフラグを返すだけにする）
function checkPlate(omikuji) {
  const plate = document.getElementById("plate").getBoundingClientRect();
  const rect = omikuji.getBoundingClientRect();
  const centerX = rect.left + rect.width / 2;
  const centerY = rect.bottom; // おみくじの下端で判定

  const onPlate =
    centerX > plate.left &&
    centerX < plate.right &&
    centerY >= plate.top &&
    centerY <= plate.bottom;

  if (onPlate) {
    // 皿の表面にピタッと合わせる
    const screenRect = document.getElementById("gameScreen").getBoundingClientRect();
    omikuji.style.top = (plate.top - screenRect.top - rect.height) + "px";
    return true;
  }

  return false;
}

// アイテムデータ
// --- ゲームの状態・アイテムレベル (最大3) ---
// --- ゲームの状態管理（初期値を設定） ---
const gameState = {
  spawnInterval: 500, // 最初は1.2秒に1回
  spawnRateLevel: 0,
  moneyMultiplier: 1,
  luckGoodLevel: 0,
  luckBadLevel: 0,
  itemLevels: {}
};

let spawnTimer = null; // タイマーを保持する変数

function restartSpawnTimer() {
  // すでに動いているタイマーがあれば、まず確実に止める
  if (spawnTimer !== null) {
    clearInterval(spawnTimer);
    spawnTimer = null;
  }

  // gameStateに設定された間隔でおみくじを降らせる
  spawnTimer = setInterval(() => {
    spawnOmikuji();
    console.log("おみくじを降らせました");
  }, gameState.spawnInterval || 1200);
}
// アイテムリストを効果付きで更新

const ITEM_LIST = [
  { id: "spawn_up",   name: "降る量アップ", price: 15, image: "daikichi.png" },
  { id: "spawn_down", name: "降る量ダウン", price: 10, image: "sp_down.png" }, // 追加
  { id: "money",      name: "報酬アップ",   price: 20, image: "money.png" },
  { id: "luck_good",  name: "吉の確率アップ", price: 20, image: "luck_kichi.png" }, // 追加
  { id: "luck_bad",   name: "大凶の確率アップ", price: 12, image: "luck_kyo.png" }   // 追加
];


let currentItems = [];

// ショップの更新（ランダムに2つ選ぶ）
function resetShop() {
  currentItems = [];
  for (let i = 0; i < 2; i++) {
    const randomItem = ITEM_LIST[Math.floor(Math.random() * ITEM_LIST.length)];
    currentItems.push({ ...randomItem, soldOut: false });
    
    const slot = document.getElementById(`item${i}`);
    slot.classList.remove("sold-out");
    slot.querySelector(".item-price").textContent = `￥${randomItem.price}`;
    
    // アイテム画像を反映
    const imgDiv = slot.querySelector(".item-image");
    imgDiv.style.backgroundImage = `url(${randomItem.image})`;
  }
  updateShopVisuals();
}

// 所持金チェックして光らせる
function updateShopVisuals() {
  currentItems.forEach((item, i) => {
    const slot = document.getElementById(`item${i}`);
    if (!item.soldOut && money >= item.price) {
      slot.classList.add("can-buy");
    } else {
      slot.classList.remove("can-buy");
    }
  });
}

// 購入処理
function buyItem(index) {
  const item = currentItems[index];
  const currentLv = gameState.itemLevels[item.name] || 0;

  // 3回制限のチェック
  if (currentLv >= 3) {
    alert("このアイテムは最大レベルです！");
    return;
  }

  if (money >= item.price && !item.soldOut) {
    money -= item.price;
    gameState.itemLevels[item.name]++; // レベルアップ
    
    // 効果の適用
    applyItemEffect(item.id, gameState.itemLevels[item.name]);

    document.getElementById("money").textContent = money;
    document.getElementById(`item${index}`).classList.add("sold-out");
    updateShopVisuals();
  }
}

function applyItemEffect(id, level) {
  switch(id) {
    case "spawn_up":
      // 降る間隔を短くする (速くなる)
      gameState.spawnInterval = Math.max(200, 1200 - (level * 300));
      restartSpawnTimer();
      break;
    case "spawn_down":
      // 降る間隔を長くする (遅くなる)
      gameState.spawnInterval = 1200 + (level * 500);
      restartSpawnTimer();
      break;
    case "money":
      gameState.moneyMultiplier = 1 + (level * 0.5);
      break;
    case "luck_good":
      gameState.luckGoodLevel = level; // 吉・大吉が出やすくなる
      break;
    case "luck_bad":
      gameState.luckBadLevel = level;  // 凶・大凶が出やすくなる
      break;
  }
}


// おみくじ判定時にもショップを更新
// checkDrop関数の money 更新後に updateShopVisuals(); を呼んでください
