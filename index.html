<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>緑玉神社</title>
<style>
/* --- 1. デバイス全体の固定設定 --- */
body {
  margin: 0;
  padding: 0;
  background: #000;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  width: 100vw;
  overflow: hidden; /* スクロール禁止 */
  position: fixed;  /* スマホのバウンス禁止  */
  touch-action: none; /* ブラウザ操作を無効化  */
}

/* --- 2. ゲーム画面の比率固定 --- */
#gameScreen {
  position: relative;
  aspect-ratio: 9 / 17;
  height: 95vh;     /* 画面の高さに合わせる */
  width: auto;
  max-width: 100vw;
  background: #fff;
  overflow: hidden; 
  border-radius: 10px;
  touch-action: none; /* ゲーム内操作を優先 [cite: 6] */
}

/* --- 3. 判定ゾーンのレスポンシブ化 --- */
/* --- 判定ゾーンをサッカーゴール風に --- */
/* --- 判定ゾーンをデバイス幅に左右されず端に固定 --- */
#badZone, #goodZone {
  position: absolute;
  bottom: 35%;
  width: 28%;          /* 画面幅の28%に固定 */
  height: 20%;         /* 高さも%にすると縦長デバイスでも安定します */
  border: 4px solid;
  border-bottom: none; 
  background: rgba(255, 255, 255, 0.2);
  z-index: 5;
}

#badZone { 
  left: -12%;             /* 左端にぴったり配置 */
  border-color: purple; 
  border-left: none;   /* 左側の線を消すとよりゴールっぽくなります */
  transform: rotate(-10deg);
  transform-origin: left bottom; /* 左下を軸に回転 */
}

#goodZone { 
  right: -12%;            /* 右端にぴったり配置 */
  border-color: red; 
  border-right: none;  /* 右側の線を消す */
  transform: rotate(10deg);
  transform-origin: right bottom; /* 右下を軸に回転 */
}
/* --- 4. 皿の位置を固定 --- */
#plate {
  position: absolute;
  bottom: 30%;
  left: 50%;
  transform: translateX(-50%);
  width: 55%;           /* 少し幅を広めに */
  height: 5%;         /* 台座の厚み */
  background: linear-gradient(to bottom, #e0e0e0, #bdbdbd); /* 前面のグラデーション */
  border-radius: 4px;
  z-index: 6;
  box-shadow: 0 10px 20px rgba(0,0,0,0.3); /* 下に落とす影 */
}
/* 台座の「上面（奥行き部分）」 */
#plate::before {
  content: "";
  position: absolute;
  top: -15px;           /* 厚みの分だけ上に配置 */
  left: 0;
  width: 100%;
  height: 15px;
  background: #824242;  /* 上面は光が当たって明るい色 */
  border-radius: 4px 4px 0 0;
  transform: perspective(100px) rotateX(40deg); /* 奥行きを出すマジック */
}

/* 台座の「脚（下の支え部分）」 */
#plate::after {
  content: "皿";       /* 文字を入れる場合はここ */
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
  color: #757575;
  position: absolute;
  bottom: -100%;
  left: 15%;
  width: 70%;
  height: 100%;
  background: #9e9e9e;
  clip-path: polygon(10% 0%, 90% 0%, 100% 100%, 0% 100%); /* 台形にする */
}
/* --- おみくじのサイズも調整 --- */
/* --- おみくじのサイズ固定 --- */
.omikuji {
  position: absolute;
  width: 11%;          /* 画面幅の22%に固定 */
  aspect-ratio: 1 / 1.5; /* 用意した画像の縦横比に合わせて調整（例：縦長 1 / 1.5） */
  z-index: 10;
  touch-action: none;   /* 操作を安定させる */
  
  /* --- 【ここを追加】画像の表示設定 --- */
  background-size: contain;      /* 画像全体が収まるように */
  background-repeat: no-repeat;  /* 繰り返さない */
  background-position: center;   /* 中央に配置 */
  background-color: transparent; /* 背景色は透明に（画像優先） */
  
  /* 画像の上に文字を表示する場合のスタイル */
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff; /* 文字色 */
  font-weight: bold;
  font-size: 1.5vw;
}
/* 文字選択と長押しメニューを完全に禁止 */
* {
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
}
.omikuji {
  /* ドラッグしやすくするため、タッチ時の挙動を制限 */
  touch-action: none;
  cursor: grab;
  /* 色が赤に固定されていたので、クラスで指定できるように変更 */
}
.good { background-color: #ff4444; }
.bad { background-color: #4444ff; }


#gameScreen {
  position: relative;
  aspect-ratio: 9 / 17; /* 比率を9:17に固定  */
  height: 95vh;
  background: #fff;
  overflow: hidden;
  border-radius: 10px;
}

#modeSelect {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-color: #ffccaa; /* お手本に近いオレンジ色 */
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  z-index: 100;
}

.menu-container {
  display: flex;
  flex-direction: column;
  gap: 20px;
  width: 80%;
}

.menu-btn {
  padding: 15px 0;
  font-size: 1.2rem;
  font-weight: bold;
  background: #fff;
  border: 2px solid #2e7d32; /* 緑の枠線 */
  border-radius: 8px;
  cursor: pointer;
}
.money-effect {
  pointer-events: none;
  font-weight: 900; /* より太く */
  font-family: 'Arial Black', sans-serif;
  text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
  transform: translateX(-50%);
  white-space: nowrap; /* 改行防止 */
  animation: moneyUp 1.0s ease-out forwards; /* 少しだけ長く表示 */
}

@keyframes moneyUp {
  0% {
    transform: translate(-50%, 0) scale(0.5);
    opacity: 0;
  }
  20% {
    transform: translate(-50%, -20px) scale(1.2); /* 最初だけ少し膨らむ演出 */
    opacity: 1;
  }
  100% {
    transform: translate(-50%, -120px) scale(1.0);
    opacity: 0;
  }
}
  /* --- おみくじの情報表示 --- */
#info {
  /* 親の #gameScreen を基準にする */
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 6%; /* 少し高さを出すとバランスが良いです */
  display: flex;
  justify-content: space-around;
  align-items: center;
  background: rgba(0, 0, 0, 0.7); /* 少し濃いめの半透明黒 */
  color: #fff;
  z-index: 110; /* モード選択や皿よりも上に表示 */
  border-bottom: 2px solid #ffcc00; /* 下に金色の線を引くと神社っぽくなります */
}

/* 各項目の調整 */
.info-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  flex: 1;
}

.label {
  font-size: 2%;
  color: #ffcc00;
  font-weight: bold;
}

#time, #money, #score {
  font-family: 'Courier New', Courier, monospace; /* 数字を等幅にするとガタつきません */
}
#shopContainer {
  position: absolute;
  bottom: 2%;         /* 画面の一番下から2%の位置 */
  left: 50%;
  transform: translateX(-50%);
  width: 95%;         /* 横幅いっぱい */
  display: none;      /* JSでflexに切り替える */
  justify-content: center;
  gap: 15px;          /* アイテム間の隙間 */
  z-index: 200;       /* 皿やゾーンよりも手前に */
  pointer-events: auto; /* クリックを有効に */
}

.item-slot {
  width: 80px;
  height: 100px;
  background: rgba(255, 255, 255, 0.9);
  border: 3px solid #ccc;
  border-radius: 10px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-around;
}

/* 買える時に光る演出 */
/* 買える時に光る演出（より目立たせる） */
.item-slot.can-buy {
  border-color: #1eff00;
  box-shadow: 0 0 20px #3eb752;
  background: rgb(187, 255, 174); /* 背景も少し黄色く */
  animation: pulse 1.0s infinite ease-in-out; /* 1.5sから1.0sに速く */
}
.item-image {
  width: 50px;       /* 必須：幅 */
  height: 50px;      /* 必須：高さ */
  background-size: contain;      /* 画像を枠内に収める */
  background-repeat: no-repeat;  /* 繰り返さない */
  background-position: center;   /* 中央に配置 */
  margin-bottom: 5px;
  /* background-color: #eee; */ /* デバッグ用：これを入れて灰色になれば枠は存在しています */
}
@keyframes pulse {
  0% { transform: scale(1); box-shadow: 0 0 5px #00ff2f; }
  50% { transform: scale(1.08); box-shadow: 0 0 25px #00ff2f; }
  100% { transform: scale(1); box-shadow: 0 0 5px #00ff2f; }
}

/* 売り切れ状態 */
.item-slot.sold-out {
  background: #555 !important;
  box-shadow: none !important;
  animation: none !important;
  pointer-events: none;
}
.item-slot.sold-out::after {
  content: "SOLD OUT";
  color: red;
  font-weight: bold;
  font-size: 10px;
}

#resetBtn {
  padding: 10px;
  background: #ff4444;
  color: white;
  border: none;
  border-radius: 5px;
  font-weight: bold;
}
</style>
</head>

<div id="gameScreen">
  <div id="info" style="display:none;">
    <div class="info-item">
      <span class="label">￥</span>
      <span id="money">0</span>
    </div>
    <div class="info-item timer">
      <span id="time">0</span>
    </div>
    <div class="info-item">
      <span class="label">数</span>
      <span id="score">0</span>
    </div>
  </div>
  <div id="shopContainer" style="display:none;">
    <div class="item-slot" id="item0" onclick="buyItem(0)">
      <div class="item-image"></div>
      <div class="item-price">￥0</div>
      <div class="item-level">Lv.0</div> 
    </div>
    <div class="item-slot" id="item1" onclick="buyItem(1)">
      <div class="item-image"></div>
      <div class="item-price">￥0</div>
      <div class="item-level">Lv.0</div> 
    </div>
    <button id="resetBtn" onclick="resetShop()">更新</button>
  </div>
<!-- モード選択画面 -->

  <div id="modeSelect">
    <div class="menu-container">
      <button class="menu-btn">エンドレス</button>
      <button id="startBtn" class="menu-btn">スタート</button>
      <button class="menu-btn">今はなし</button>
    </div>
  </div>


  <div id="badZone" style="display:none;">悪い</div>
  <div id="goodZone" style="display:none;">良い</div>

</div>
<script src="parameters.js"></script>
<script>


// 内部管理用変数
let timeLeft = PARAMS.gameTime;
let score = 0;
let gameInterval;
let fallInterval;
let dragging = null;


document.getElementById("startBtn").onclick = () => {
  // すでにゲームが始まっていたら何もしない（連打防止）
  if (spawnTimer !== null) return; 

  document.getElementById("modeSelect").style.display = "none";
  document.getElementById("info").style.display = "flex";
  document.getElementById("shopContainer").style.display = "flex";
  
  // 各要素の表示
  document.getElementById("badZone").style.display = "block";
  document.getElementById("goodZone").style.display = "block";
  document.getElementById("plate").style.display = "block";

  resetShop();
  
  // 初期の間隔を設定してタイマー起動
  gameState.spawnInterval = 1200; 
  restartSpawnTimer(); 
  
  startGame(); // タイムカウントダウンなど
};

function startGame() {
  gameInterval = setInterval(() => {
    timeLeft--;
    document.getElementById("time").textContent = timeLeft;
    if (timeLeft <= 0) endGame();
  }, 1000);

}

function endGame() {
  clearInterval(gameInterval);
  clearInterval(fallInterval);
  alert("ゲーム終了！ 入れた数：" + score);
}


// ==========================================


function spawnOmikuji() {
  const gameScreen = document.getElementById("gameScreen");
  const omikuji = document.createElement("div");

  // 基本のプール
  let pool = ["大吉", "吉", "中吉", "小吉", "末吉", "凶"];

  // 1. 大吉レベル：大吉のみを増やす
  for (let i = 0; i < gameState.itemLevels["luck_daikichi"] * 5; i++) {
    pool.push("大吉");
  }

  // 2. 吉レベル：大吉と凶以外（吉・中吉・小吉・末吉）を増やす
  for (let i = 0; i < gameState.itemLevels["luck_kichi"] * 2; i++) {
    pool.push("吉", "中吉", "小吉", "末吉");
  }

  // 3. 凶レベル：凶のみを極端に増やす
  for (let i = 0; i < gameState.itemLevels["luck_kyo"] * 5; i++) {
    pool.push("凶");
  }
console.log(pool);
  const typeName = pool[Math.floor(Math.random() * pool.length)];
  const config = OMIKUJI_TYPES[typeName];
  
  // 以降、描画処理...
  omikuji.className = "omikuji";
  omikuji.dataset.type = typeName;
  if (config.image) {
    omikuji.style.backgroundImage = `url(${config.image})`;
  } else {
    omikuji.style.backgroundColor = config.color;
    omikuji.textContent = typeName;
  }

  gameScreen.appendChild(omikuji);
  
  // --- 以下、座標計算とドラッグ処理 ---
  const screenWidth = gameScreen.clientWidth;
  const oWidth = omikuji.offsetWidth || (screenWidth * 0.22);
  const minLeft = screenWidth * 0.3; 
  const maxLeft = screenWidth * 0.7 - oWidth;
  omikuji.style.left = (Math.random() * (maxLeft - minLeft) + minLeft) + "px";
  omikuji.style.top = "-100px";
  let vx = 0; // 横速度
  let vy = 0; // 縦速度
  let isOnPlate = false;

  const fall = setInterval(() => {
    if (dragging === omikuji || isOnPlate) return;

    // 重力計算（PARAMSを使用） 
    vy += PARAMS.gravity;
    if (vy > PARAMS.maxFallSpeed) vy = PARAMS.maxFallSpeed;
    
    // 座標更新
    let x = parseFloat(omikuji.style.left) + vx;
    let y = parseFloat(omikuji.style.top) + vy;

    // 壁バウンド（画面幅に合わせて動的に判定） 
    if (x < 0) {
      x = 0;
      vx *= PARAMS.bounceLimit;
    } else if (x > screenWidth - oWidth) {
      x = screenWidth - oWidth;
      vx *= PARAMS.bounceLimit;
    }

    omikuji.style.left = x + "px";
    omikuji.style.top = y + "px";

    // 速度減衰（慣性） 
    vx *= PARAMS.friction;

    // 皿判定 
    if (checkPlate(omikuji)) {
      isOnPlate = true;
      vx = 0; vy = 0;
    }

    // ゴール判定 
    checkDrop(omikuji);

    // 画面外削除
    if (y > gameScreen.clientHeight) {
      clearInterval(fall);
      omikuji.remove();
    }
  }, 16);

  // --- ドラッグ＆はじく処理（中心点ズレ修正版） ---
  omikuji.onpointerdown = (e) => {
    e.preventDefault();
    dragging = omikuji;
    isOnPlate = false;
    omikuji.setPointerCapture(e.pointerId);

    let lastX = e.clientX;
    let lastY = e.clientY;

    const move = (ev) => {
      if (dragging !== omikuji) return;
      
      // 速度計算 
      vx = (ev.clientX - lastX) * PARAMS.tossPower;
      vy = (ev.clientY - lastY) * PARAMS.tossPower;
      lastX = ev.clientX;
      lastY = ev.clientY;

      const sRect = gameScreen.getBoundingClientRect();
      
      // 指の真ん中におみくじが来るように計算 
      omikuji.style.left = (ev.clientX - sRect.left - (omikuji.offsetWidth / 2)) + "px";
      omikuji.style.top = (ev.clientY - sRect.top - (omikuji.offsetHeight / 2)) + "px";
    };

    const up = () => {
      document.removeEventListener("pointermove", move);
      document.removeEventListener("pointerup", up);
      dragging = null;
    };
    
    document.addEventListener("pointermove", move);
    document.addEventListener("pointerup", up);
  };
}
// --- 良い・悪いゾーンの判定 ---
let money = 0; // お金の変数を追加

function checkDrop(omikuji) {

const rect = omikuji.getBoundingClientRect();
  const gameRect = document.getElementById("gameScreen").getBoundingClientRect(); // 画面の基準を取得
  
  const goodGoal = document.getElementById("goodZone").getBoundingClientRect();
  const badGoal = document.getElementById("badZone").getBoundingClientRect();

  const typeName = omikuji.dataset.type;
  const config = OMIKUJI_TYPES[typeName];
  let earnedMoney = 0;
  let scored = false;

  // 「良い方」に入った場合
  if (isOverlap(rect, goodGoal)) {
    earnedMoney = config.goodPay;
    scored = true;
  } 
  // 「悪い方」に入った場合
  else if (isOverlap(rect, badGoal)) {
    earnedMoney = config.badPay;
    scored = true;
  }

if (scored) {
    const finalPay = Math.floor(earnedMoney * gameState.moneyMultiplier);
    money += finalPay;
    score++;
    
    document.getElementById("money").textContent = money;
    updateShopVisuals();

    // 相対座標の計算
    const relativeX = rect.left - gameRect.left + (rect.width / 2);
    const relativeY = rect.top - gameRect.top;

    // 【ここを修正】金額に応じてサイズを計算 (最小20px、最大値777円の時に巨大になるよう設定)
    // 20px (基本) + (金額 / 777 * 60px) くらいの計算にすると、最大80px程度になります
    const fontSize = Math.min(50, 10 + (finalPay / 777) * 100);

    showMoneyEffect(relativeX, relativeY, finalPay, fontSize);
    omikuji.remove();
  }
}

// 金額が浮き出る演出
function showMoneyEffect(x, y, amount, size) {
  const gameScreen = document.getElementById("gameScreen");
  const effect = document.createElement("div");
  
  effect.textContent = (amount >= 0 ? "+" : "") + amount;
  effect.className = "money-effect";
  
  // 位置と【サイズ】の設定
  effect.style.position = "absolute";
  effect.style.left = x + "px";
  effect.style.top = y + "px";
  effect.style.fontSize = size + "px"; // 動的なサイズ適用
  
  // 金額が大きいほど色を豪華にする演出（オプション）
  if (amount >= 777) {
    effect.style.color = "#7fffd4"; // ラッキーセブンは特別色
    effect.style.textShadow = "0 0 10px #fff, 0 0 20px #ff00ff";
  } else {
    effect.style.color = amount > 0 ? "#eaff00" : "#7dffa6";
  }
  
  effect.style.zIndex = 200;
  gameScreen.appendChild(effect);
  
  effect.addEventListener('animationend', () => {
    effect.remove();
  });
}

function isOverlap(a, b) {
  return !(a.right < b.left || a.left > b.right || a.bottom < b.top || a.top > b.bottom);
}

// --- 皿の判定 ---
// 皿判定の修正（タイマーを止めずに、乗っているフラグを返すだけにする）
function checkPlate(omikuji) {
  const plate = document.getElementById("plate").getBoundingClientRect();
  const rect = omikuji.getBoundingClientRect();
  const centerX = rect.left + rect.width / 2;
  const centerY = rect.bottom; // おみくじの下端で判定

  const onPlate =
    centerX > plate.left &&
    centerX < plate.right &&
    centerY >= plate.top &&
    centerY <= plate.bottom;

  if (onPlate) {
    // 皿の表面にピタッと合わせる
    const screenRect = document.getElementById("gameScreen").getBoundingClientRect();
    omikuji.style.top = (plate.top - screenRect.top - rect.height) + "px";
    return true;
  }

  return false;
}



let spawnTimer = null; // タイマーを保持する変数

function restartSpawnTimer() {
  // すでに動いているタイマーがあれば、まず確実に止める
  if (spawnTimer !== null) {
    clearInterval(spawnTimer);
    spawnTimer = null;
  }

  // gameStateに設定された間隔でおみくじを降らせる
  spawnTimer = setInterval(() => {
    spawnOmikuji();
    console.log("おみくじを降らせました", gameState.spawnInterval );
  }, gameState.spawnInterval || 1200);
}



let currentItems = [];

// ショップの更新（ランダムに2つ選ぶ）
function resetShop() {
  currentItems = [];
  const shopContainer = document.getElementById("shopContainer");
  
  for (let i = 0; i < 2; i++) {
    const randomItem = ITEM_LIST[Math.floor(Math.random() * ITEM_LIST.length)];
    // 現在のレベルを取得
    const currentLv = gameState.itemLevels[randomItem.id] || 0;
    
    // 売り切れ判定：このアイテムのレベルが既に3なら最初から売り切れにする
    const isMax = currentLv >= 3;
    
    currentItems.push({ ...randomItem, soldOut: isMax });
    
    const slot = document.getElementById(`item${i}`);
    slot.classList.remove("sold-out");
    if (isMax) slot.classList.add("sold-out");

    // 価格とレベルの表示（Lv.1 / 3 のように出すと分かりやすいです）
    slot.querySelector(".item-price").textContent = `￥${randomItem.price}`;
    slot.querySelector(".item-level").textContent = `Lv.${currentLv}`;

    // アイテム名の横や下にレベルを表示したい場合は、HTMLに専用の枠を作るか、
    // 以下のようにテキストを書き換えます
    const nameEl = slot.querySelector(".item-name") || slot; 
    // ※item-nameというクラスをHTMLに追加することをお勧めします
    
    const imgDiv = slot.querySelector(".item-image");
    if (imgDiv) imgDiv.style.backgroundImage = `url('${randomItem.image}')`;
  }
  updateShopVisuals();
}

// 所持金チェックして光らせる
function updateShopVisuals() {
  currentItems.forEach((item, i) => {
    const slot = document.getElementById(`item${i}`);

    if (!item.soldOut && money >= item.price) {
      slot.classList.add("can-buy");
    } else {
      slot.classList.remove("can-buy");
    }
  });
}

// 購入処理
function buyItem(index) {
  const item = currentItems[index];
  const id = item.id;

  if (money >= item.price && !item.soldOut) {
    money -= item.price;
    
    // 自レベルアップ (最大3)
    if (gameState.itemLevels[id] < 3) {
      gameState.itemLevels[id]++;
    }

    // --- ここから「降る量」の排他ロジック ---
    if (id === "spawn_up") {
      // アップを買ったらダウンを1下げる
      gameState.itemLevels["spawn_down"] = Math.max(0, gameState.itemLevels["spawn_down"] - 1);
    } else if (id === "spawn_down") {
      // ダウンを買ったらアップを1下げる
      gameState.itemLevels["spawn_up"] = Math.max(0, gameState.itemLevels["spawn_up"] - 1);
    }
    // ------------------------------------

    // 運勢系の排他ロジック（前回の分も維持）
    if (id === "luck_daikichi") {
      gameState.itemLevels["luck_kichi"] = Math.max(0, gameState.itemLevels["luck_kichi"] - 1);
      gameState.itemLevels["luck_kyo"] = Math.max(0, gameState.itemLevels["luck_kyo"] - 1);
    } else if (id === "luck_kichi") {
      gameState.itemLevels["luck_daikichi"] = Math.max(0, gameState.itemLevels["luck_daikichi"] - 1);
      gameState.itemLevels["luck_kyo"] = Math.max(0, gameState.itemLevels["luck_kyo"] - 1);
    } else if (id === "luck_kyo") {
      gameState.itemLevels["luck_daikichi"] = Math.max(0, gameState.itemLevels["luck_daikichi"] - 1);
      gameState.itemLevels["luck_kichi"] = Math.max(0, gameState.itemLevels["luck_kichi"] - 1);
    }

    item.soldOut = true;
    
    // 【重要】即時反映：現在のIDの効果を適用
    applyItemEffect(id, gameState.itemLevels[id]);
    // 打ち消し合った相手の効果も再計算（間隔を戻すため）
    if(id === "spawn_up") applyItemEffect("spawn_down", gameState.itemLevels["spawn_down"]);
    if(id === "spawn_down") applyItemEffect("spawn_up", gameState.itemLevels["spawn_up"]);

    document.getElementById("money").textContent = money;
    document.getElementById(`item${index}`).classList.add("sold-out");
    updateShopVisuals();
  }
}

function applyItemEffect(id, level) {
  console.log(`効果適用：${id}, レベル：${level}`);

  switch(id) {
    // 降る量に関連するIDなら、両方のレベルを考慮して間隔を再計算
    case "spawn_up":
    case "spawn_down":
      const upLv = gameState.itemLevels["spawn_up"] || 0;
      const downLv = gameState.itemLevels["spawn_down"] || 0;
      
      // 基本1200ms。アップ1につき-300ms、ダウン1につき+500ms
      // (例: アップLv1, ダウンLv0 => 900ms)
      // (例: アップLv1, ダウンLv1 => 1400ms ※打ち消し合いが起こるのでこのケースは基本ないはず)
      let newInterval = 1200 - (upLv * 300) + (downLv * 500);
      
      // 速すぎ・遅すぎの制限
      gameState.spawnInterval = Math.max(200, Math.min(3000, newInterval));
      
      console.log(`新しい降る間隔: ${gameState.spawnInterval}ms`);
      restartSpawnTimer(); // 即座に新しい間隔で再始動
      break;

    case "money":
      gameState.moneyMultiplier = 1 + (level * 0.5);
      break;
      
    // 運勢系は spawnOmikuji 側がレベルを直接参照するのでここではログのみ
    case "luck_daikichi":
    case "luck_kichi":
    case "luck_kyo":
      break;
  }
}
</script>
