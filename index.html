<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>緑玉神社</title>
<style>
/* --- 1. デバイス全体の固定設定 --- */
body {
  margin: 0;
  padding: 0;
  background: #000;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  width: 100vw;
  overflow: hidden; /* スクロール禁止 */
  position: fixed;  /* スマホのバウンス禁止  */
  touch-action: none; /* ブラウザ操作を無効化  */
}

/* --- 2. ゲーム画面の比率固定 --- */
#gameScreen {
  position: relative;
  aspect-ratio: 9 / 17;
  height: 95vh;     /* 画面の高さに合わせる */
  width: auto;
  max-width: 100vw;
  background: #fff;
  overflow: hidden; 
  border-radius: 10px;
  touch-action: none; /* ゲーム内操作を優先 [cite: 6] */
}
#resizeHandle {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 30px;      /* 掴みやすい太さ */
  background: linear-gradient(transparent, rgba(0,0,0,0.2)); /* 視覚的なガイド */
  cursor: ns-resize; /* 上下リサイズのカーソル */
  z-index: 2000;
  display: flex;
  justify-content: center;
  align-items: center;
}

/* ハンドルの中央に「つまみ」の線を表示 */
#resizeHandle::after {
  content: "";
  width: 40px;
  height: 4px;
  background: #888;
  border-radius: 2px;
}

/* --- 3. 判定ゾーンのレスポンシブ化 --- */
/* --- 判定ゾーンをサッカーゴール風に --- */
/* --- 判定ゾーンをデバイス幅に左右されず端に固定 --- */
#badZone, #goodZone {
  position: absolute;
  bottom: 35%;
  width: 28%;          /* 画面幅の28%に固定 */
  height: 20%;         /* 高さも%にすると縦長デバイスでも安定します */
  border: 4px solid;
  border-bottom: none; 
  background: rgba(255, 255, 255, 0.2);
  z-index: 5;
}

#badZone { 
  left: -12%;             /* 左端にぴったり配置 */
  border-color: purple; 
  border-left: none;   /* 左側の線を消すとよりゴールっぽくなります */
  transform: rotate(-10deg);
  transform-origin: left bottom; /* 左下を軸に回転 */
}

#goodZone { 
  right: -12%;            /* 右端にぴったり配置 */
  border-color: red; 
  border-right: none;  /* 右側の線を消す */
  transform: rotate(10deg);
  transform-origin: right bottom; /* 右下を軸に回転 */
}
/* --- 4. 皿の位置を固定 --- */
#plate {
  position: absolute;
  bottom: 30%;
  left: 50%;
  transform: translateX(-50%);
  width: 55%;           /* 少し幅を広めに */
  height: 5%;         /* 台座の厚み */
  background: linear-gradient(to bottom, #e0e0e0, #bdbdbd); /* 前面のグラデーション */
  border-radius: 4px;
  z-index: 6;
  box-shadow: 0 10px 20px rgba(0,0,0,0.3); /* 下に落とす影 */
}
/* 台座の「上面（奥行き部分）」 */
#plate::before {
  content: "";
  position: absolute;
  top: -15px;           /* 厚みの分だけ上に配置 */
  left: 0;
  width: 100%;
  height: 15px;
  background: #824242;  /* 上面は光が当たって明るい色 */
  border-radius: 4px 4px 0 0;
  transform: perspective(100px) rotateX(40deg); /* 奥行きを出すマジック */
}

/* 台座の「脚（下の支え部分）」 */
#plate::after {
  content: "皿";       /* 文字を入れる場合はここ */
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
  color: #757575;
  position: absolute;
  bottom: -100%;
  left: 15%;
  width: 70%;
  height: 100%;
  background: #9e9e9e;
  clip-path: polygon(10% 0%, 90% 0%, 100% 100%, 0% 100%); /* 台形にする */
}
/* --- おみくじのサイズも調整 --- */
/* --- おみくじのサイズ固定 --- */
.omikuji {
  position: absolute;
  width: 11%;          /* 画面幅の22%に固定 */
  aspect-ratio: 1 / 1.5; /* 用意した画像の縦横比に合わせて調整（例：縦長 1 / 1.5） */
  z-index: 10;
  touch-action: none;   /* 操作を安定させる */
  
  /* --- 【ここを追加】画像の表示設定 --- */
  background-size: contain;      /* 画像全体が収まるように */
  background-repeat: no-repeat;  /* 繰り返さない */
  background-position: center;   /* 中央に配置 */
  background-color: transparent; /* 背景色は透明に（画像優先） */
  
  /* 画像の上に文字を表示する場合のスタイル */
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff; /* 文字色 */
  font-weight: bold;
  font-size: 1.5vw;
}
/* 文字選択と長押しメニューを完全に禁止 */
* {
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
}
.omikuji {
  /* ドラッグしやすくするため、タッチ時の挙動を制限 */
  touch-action: none;
  cursor: grab;
  /* 色が赤に固定されていたので、クラスで指定できるように変更 */
}
.good { background-color: #ff4444; }
.bad { background-color: #4444ff; }

  /* --- おみくじの情報表示 --- */
#info {
  /* 親の #gameScreen を基準にする */

  top: 0;
  left: 0;
  width: 100%;
  height: 6%; /* 少し高さを出すとバランスが良いです */
  display: flex;
  justify-content: space-around;
  align-items: center;

}

/* 各項目の調整 */
.info-item {

}

.label {

}

#time, #money, #score {

#shopContainer {

}

}

}
/* 買える時に光る演出 */
/* 買える時に光る演出（より目立たせる） */
.item-slot.can-buy {
  border-color: #1eff00;
  box-shadow: 0 0 20px #3eb752;

}
.item-image {
  width: 50px;       /* 必須：幅 */
  height: 50px;      /* 必須：高さ */
  background-size: contain;      /* 画像を枠内に収める */
  background-repeat: no-repeat;  /* 繰り返さない */
  background-position: center;   /* 中央に配置 */
  margin-bottom: 5px;
  /* background-color: #eee; */ /* デバッグ用：これを入れて灰色になれば枠は存在しています */
}
@keyframes pulse {
  0% { transform: scale(1); box-shadow: 0 0 5px #00ff2f; }
  50% { transform: scale(1.08); box-shadow: 0 0 25px #00ff2f; }
  100% { transform: scale(1); box-shadow: 0 0 5px #00ff2f; }
}

/* 売り切れ状態 */
/* 既存の sold-out を少し強化 */
.item-slot.sold-out {
  background: #555 !important;
  opacity: 0.7;
  filter: grayscale(1);
  pointer-events: none;
  
  /* 膨張と光を強制的に上書きして消す */
  animation: none !important; 
  box-shadow: none !important;
  transform: scale(1) !important; 
}
.item-slot.sold-out::after {
  content: "SOLD OUT";
  color: red;
  font-weight: bold;
  font-size: 10px;
}

#resetBtn {
  padding: 10px;

}

/* 更新ができる時に光る */
.can-buy-reset {
  border-color: #00ffcc !important;
  box-shadow: 0 0 15px #00ffcc;
  background: #006655 !important;
  animation: pulse-reset 1.2s infinite;
}

@keyframes pulse-reset {
  0% { transform: scale(1); }

/* --- おみくじの結果表示 --- */
#resultScreen {
  position: absolute;
  top: 0; left: 0;

#resultScreen h2 {

</style>

</div>

<script>


// 内部管理用変数
let timeLeft = PARAMS.gameTime;
let score = 0;
let gameInterval;
let fallInterval;
let dragging = null;


document.getElementById("startBtn").onclick = () => {
  console.log(spawnTimer !== null);
  // すでにゲームが始まっていたら何もしない（連打防止）
  if (spawnTimer !== null) return; 

  document.getElementById("modeSelect").style.display = "none";
  document.getElementById("info").style.display = "flex";
  document.getElementById("shopContainer").style.display = "flex";
  
  // 各要素の表示
  document.getElementById("badZone").style.display = "block";
  document.getElementById("goodZone").style.display = "block";
  document.getElementById("plate").style.display = "block";
  // --- 【ここを追加】初期アイテムの補充 ---
  shopResetCost = 2; // コストをリセット
  document.getElementById("resetBtn").textContent = `更新 ￥${shopResetCost}`;
  performReset(); // 最初のアイテムを並べる
  // --------------------------------------
  // 初期の間隔を設定してタイマー起動
 // gameState.spawnInterval = 1200; 
  restartSpawnTimer(); 
  
  startGame(); // タイムカウントダウンなど
};

// 例：カウントダウンタイマーのイメージ
function startGame() {

  gameTimerId = setInterval(() => {
    timeLeft--;
    document.getElementById("time").textContent = timeLeft;
    
    if (timeLeft <= 0) {
      clearInterval(gameTimerId);
      gameTimerId = null;
      endGame();
    }
  }, 1000);
}

// --- タイムアップ時の処理 ---
function endGame() {
  // 1. 全てのタイマーを止める
  if (spawnTimer) {
    clearInterval(spawnTimer);
    spawnTimer = null;
  }
  if (gameTimerId) {
    clearInterval(gameTimerId);
    gameTimerId = null;
  }

  // 2. 【追加】画面上のおみくじを全削除
  const activeOmikujis = document.querySelectorAll('.omikuji');
  activeOmikujis.forEach(o => o.remove());

  // 3. スコア反映と表示切り替え
  document.getElementById("finalCount").textContent = score;
  document.getElementById("finalMoney").textContent = money;
  document.getElementById("resultScreen").style.display = "flex";
  document.getElementById("shopContainer").style.display = "none";
}
// --- ボタンの処理：もう一度プレイ ---
function restartGame() {
  // レベルのリセット
  resetAllItemLevels();

  // ゲームデータの初期化
  score = 0;
  money = 0;
  timeLeft = 10;
  shopResetCost = 2;
  
  // UI更新
  document.getElementById("money").textContent = money;
  document.getElementById("score").textContent = score;
  document.getElementById("resultScreen").style.display = "none";
  document.getElementById("shopContainer").style.display = "flex";

  // ショップをまっさらな状態で補充
  performReset();
  
  // ゲーム開始
  restartSpawnTimer();
  startGame();
}

// --- ボタンの処理：タイトルへ戻る ---
function goToTitle() {
  // タイマー停止と掃除
  if (spawnTimer) { clearInterval(spawnTimer); spawnTimer = null; }
  if (gameTimerId) { clearInterval(gameTimerId); gameTimerId = null; }
  document.querySelectorAll('.omikuji').forEach(o => o.remove());

  // 【重要】レベルのリセット
  resetAllItemLevels();

  // 数値と表示のリセット
  money = 0;
  score = 0;
  timeLeft = 10;
  shopResetCost = 2;

  // 画面の切り替え
    // UI更新
  document.getElementById("money").textContent = money;
  document.getElementById("score").textContent = score;
  document.getElementById("resultScreen").style.display = "none";
  document.getElementById("info").style.display = "none";
  document.getElementById("shopContainer").style.display = "none";
  document.getElementById("modeSelect").style.display = "flex";
}


// ==========================================


function spawnOmikuji() {
  const gameScreen = document.getElementById("gameScreen");
  const omikuji = document.createElement("div");
// --- 【追加】最大数制限 (例: 50個まで) ---
  const currentCount = document.querySelectorAll('.omikuji').length;
  const MAX_OMIKUJI = 50; 

  if (currentCount >= MAX_OMIKUJI) {
    // すでに上限なら、今回は生成せずに終了する
    return;
  }
  // 基本のプール
  let pool = ["大吉", "吉", "中吉", "小吉", "末吉", "凶"];

  // 1. 大吉レベル：大吉のみを増やす
  for (let i = 0; i < gameState.itemLevels["luck_daikichi"] * 5; i++) {
    pool.push("大吉");
  }

  // 2. 吉レベル：大吉と凶以外（吉・中吉・小吉・末吉）を増やす
  for (let i = 0; i < gameState.itemLevels["luck_kichi"] * 2; i++) {
    pool.push("吉", "中吉", "小吉", "末吉");
  }

  // 3. 凶レベル：凶のみを極端に増やす
  for (let i = 0; i < gameState.itemLevels["luck_kyo"] * 5; i++) {
    pool.push("凶");
  }
console.log(pool);
  const typeName = pool[Math.floor(Math.random() * pool.length)];
  const config = OMIKUJI_TYPES[typeName];
  
  // 以降、描画処理...
  omikuji.className = "omikuji";
  omikuji.dataset.type = typeName;
  if (config.image) {
    omikuji.style.backgroundImage = `url(${config.image})`;
  } else {
    omikuji.style.backgroundColor = config.color;
    omikuji.textContent = typeName;
  }

  gameScreen.appendChild(omikuji);
  
  // --- 以下、座標計算とドラッグ処理 ---
  const screenWidth = gameScreen.clientWidth;
  const oWidth = omikuji.offsetWidth || (screenWidth * 0.22);
  const minLeft = screenWidth * 0.3; 
  const maxLeft = screenWidth * 0.7 - oWidth;
  omikuji.style.left = (Math.random() * (maxLeft - minLeft) + minLeft) + "px";
  omikuji.style.top = "-100px";
  let vx = 0; // 横速度
  let vy = 0; // 縦速度
  let isOnPlate = false;

  const fall = setInterval(() => {
    if (dragging === omikuji || isOnPlate) return;

    // 重力計算（PARAMSを使用） 
    vy += PARAMS.gravity;
    if (vy > PARAMS.maxFallSpeed) vy = PARAMS.maxFallSpeed;
    
    // 座標更新
    let x = parseFloat(omikuji.style.left) + vx;
    let y = parseFloat(omikuji.style.top) + vy;

    // 壁バウンド（画面幅に合わせて動的に判定） 
    if (x < 0) {
      x = 0;
      vx *= PARAMS.bounceLimit;
    } else if (x > screenWidth - oWidth) {
      x = screenWidth - oWidth;
      vx *= PARAMS.bounceLimit;
    }

    omikuji.style.left = x + "px";
    omikuji.style.top = y + "px";

    // 速度減衰（慣性） 
    vx *= PARAMS.friction;

    // 皿判定 
    if (checkPlate(omikuji)) {
      isOnPlate = true;
      vx = 0; vy = 0;
    }

    // ゴール判定 
    checkDrop(omikuji);

    // 画面外削除
    if (y > gameScreen.clientHeight) {
      clearInterval(fall);
      omikuji.remove();
    }
  }, 16);

  // --- ドラッグ＆はじく処理（中心点ズレ修正版） ---
  omikuji.onpointerdown = (e) => {
    e.preventDefault();
    dragging = omikuji;
    isOnPlate = false;
    omikuji.setPointerCapture(e.pointerId);

    let lastX = e.clientX;
    let lastY = e.clientY;

    const move = (ev) => {
      if (dragging !== omikuji) return;
      
      // 速度計算 
      vx = (ev.clientX - lastX) * PARAMS.tossPower;
      vy = (ev.clientY - lastY) * PARAMS.tossPower;
      lastX = ev.clientX;
      lastY = ev.clientY;

      const sRect = gameScreen.getBoundingClientRect();
      
      // 指の真ん中におみくじが来るように計算 
      omikuji.style.left = (ev.clientX - sRect.left - (omikuji.offsetWidth / 2)) + "px";
      omikuji.style.top = (ev.clientY - sRect.top - (omikuji.offsetHeight / 2)) + "px";
    };

    const up = () => {
      document.removeEventListener("pointermove", move);
      document.removeEventListener("pointerup", up);
      dragging = null;
    };
    
    document.addEventListener("pointermove", move);
    document.addEventListener("pointerup", up);
  };
}
// --- 良い・悪いゾーンの判定 ---
let money = 0; // お金の変数を追加

function checkDrop(omikuji) {

const rect = omikuji.getBoundingClientRect();
  const gameRect = document.getElementById("gameScreen").getBoundingClientRect(); // 画面の基準を取得
  
  const goodGoal = document.getElementById("goodZone").getBoundingClientRect();
  const badGoal = document.getElementById("badZone").getBoundingClientRect();

  const typeName = omikuji.dataset.type;
  const config = OMIKUJI_TYPES[typeName];
  let earnedMoney = 0;
  let scored = false;

  // 「良い方」に入った場合
  if (isOverlap(rect, goodGoal)) {
    earnedMoney = config.goodPay;
    scored = true;
  } 
  // 「悪い方」に入った場合
  else if (isOverlap(rect, badGoal)) {
    earnedMoney = config.badPay;
    scored = true;
  }

if (scored) {
    const finalPay = Math.floor(earnedMoney * gameState.moneyMultiplier);
    money += finalPay;
    score++;
    
    document.getElementById("money").textContent = money;
    updateShopVisuals();

    // 相対座標の計算
    const relativeX = rect.left - gameRect.left + (rect.width / 2);
    const relativeY = rect.top - gameRect.top;

    // 【ここを修正】金額に応じてサイズを計算 (最小20px、最大値777円の時に巨大になるよう設定)
    // 20px (基本) + (金額 / 777 * 60px) くらいの計算にすると、最大80px程度になります
    const fontSize = Math.min(50, 10 + (finalPay / 777) * 100);

    showMoneyEffect(relativeX, relativeY, finalPay, fontSize);
    omikuji.remove();
  }
}

// 金額が浮き出る演出
function showMoneyEffect(x, y, amount, size) {
  const gameScreen = document.getElementById("gameScreen");
  const effect = document.createElement("div");
  
  effect.textContent = (amount >= 0 ? "+" : "") + amount;
  effect.className = "money-effect";
  
  // 位置と【サイズ】の設定
  effect.style.position = "absolute";
  effect.style.left = x + "px";
  effect.style.top = y + "px";
  effect.style.fontSize = size + "px"; // 動的なサイズ適用
  
  // 金額が大きいほど色を豪華にする演出（オプション）
  if (amount >= 777) {
    effect.style.color = "#7fffd4"; // ラッキーセブンは特別色
    effect.style.textShadow = "0 0 10px #fff, 0 0 20px #ff00ff";
  } else {
    effect.style.color = amount > 0 ? "#eaff00" : "#7dffa6";
  }
  
  effect.style.zIndex = 200;
  gameScreen.appendChild(effect);
  
  effect.addEventListener('animationend', () => {
    effect.remove();
  });
}

function isOverlap(a, b) {
  return !(a.right < b.left || a.left > b.right || a.bottom < b.top || a.top > b.bottom);
}

// --- 皿の判定 ---
// 皿判定の修正（タイマーを止めずに、乗っているフラグを返すだけにする）
function checkPlate(omikuji) {
  const plate = document.getElementById("plate").getBoundingClientRect();
  const rect = omikuji.getBoundingClientRect();
  const centerX = rect.left + rect.width / 2;
  const centerY = rect.bottom; // おみくじの下端で判定

  const onPlate =
    centerX > plate.left &&
    centerX < plate.right &&
    centerY >= plate.top &&
    centerY <= plate.bottom;

  if (onPlate) {
    // 皿の表面にピタッと合わせる
    const screenRect = document.getElementById("gameScreen").getBoundingClientRect();
    omikuji.style.top = (plate.top - screenRect.top - rect.height) + "px";
    return true;
  }

  return false;
}



let spawnTimer = null; // タイマーを保持する変数

function restartSpawnTimer() {
  // すでに動いているタイマーがあれば、まず確実に止める
  if (spawnTimer !== null) {
    clearInterval(spawnTimer);
    spawnTimer = null;
  }

  // gameStateに設定された間隔でおみくじを降らせる
  spawnTimer = setInterval(() => {
    spawnOmikuji();
    console.log("おみくじを降らせました", gameState.spawnInterval );
  }, gameState.spawnInterval || 1200);
}



let currentItems = [];

// ショップの更新（ランダムに2つ選ぶ）




// ボタンが押された時の専用関数を作ると分かりやすいです
function attemptReset() {
  if (money >= shopResetCost) {
    money -= shopResetCost;
    shopResetCost += 3; // 次回コストを+3円
    
    // UI更新
    document.getElementById("money").textContent = money;
    
    // アイテム入れ替え実行
    performReset(); 
  }
}

// 実際の入れ替え処理
function performReset() {
  currentItems = [];
  for (let i = 0; i < 2; i++) {
    const randomItem = ITEM_LIST[Math.floor(Math.random() * ITEM_LIST.length)];
    const currentLv = gameState.itemLevels[randomItem.id] || 0;
    const isMax = currentLv >= 3;
    
    currentItems.push({ ...randomItem, soldOut: isMax });
    
    const slot = document.getElementById(`item${i}`);
    slot.classList.remove("sold-out");
    if (isMax) slot.classList.add("sold-out");

    // テキスト反映
    slot.querySelector(".item-price").textContent = `￥${randomItem.price}`;
    slot.querySelector(".item-level").textContent = `Lv.${currentLv}`; // Lvを表示
    
    const imgDiv = slot.querySelector(".item-image");
    if (imgDiv) imgDiv.style.backgroundImage = `url('${randomItem.image}')`;
  }
  document.getElementById("resetBtn").textContent = `更新 ￥${shopResetCost}`;
  updateShopVisuals();
}

// 所持金チェックして光らせる
function updateShopVisuals() {
  // アイテムの光る判定
  currentItems.forEach((item, i) => {
    const slot = document.getElementById(`item${i}`);
    if (!item.soldOut && money >= item.price) {
      slot.classList.add("can-buy");
    } else {
      slot.classList.remove("can-buy");
    }
  });

  // 【追加】更新ボタンの光る判定
  const resetBtn = document.getElementById("resetBtn");
  if (money >= shopResetCost) {
    resetBtn.classList.add("can-buy-reset");
  } else {
    resetBtn.classList.remove("can-buy-reset");
  }
}
function buyItem(index) {
  const item = currentItems[index];
  const id = item.id;
  const currentLv = gameState.itemLevels[id] || 0;

  // 1. 購入制限チェック
  if (currentLv >= 3 || item.soldOut) return;

  if (money >= item.price) {
    money -= item.price;
    
    // 2. 自身のレベルを上げる
    gameState.itemLevels[id]++;

    // 3. 【重要】排他ロジック（他方のレベルを下げる）を実行
    handleExclusion(id);

    // 4. 購入したスロットを「この回は売り切れ」にする
    item.soldOut = true;

    // 5. お金の表示を更新
    document.getElementById("money").textContent = money;

    // 6. 【ここが解決策】ショップに並んでいる全スロットの見た目を最新状態にする
    refreshShopUI(); 
    
    // 7. 効果を即反映
    applyItemEffect(id, gameState.itemLevels[id]);
  }
}
function refreshShopUI() {
  currentItems.forEach((item, i) => {
    const slot = document.getElementById(`item${i}`);
    const currentLv = gameState.itemLevels[item.id] || 0;

    // レベル表示を最新にする
    const lvDiv = slot.querySelector(".item-level");
    if (lvDiv) lvDiv.textContent = `Lv.${currentLv}`;

    // 売り切れ判定の更新
    // 「今回買った」または「累計レベルが3に達している」なら sold-out クラスをつける
    if (item.soldOut || currentLv >= 3) {
      slot.classList.add("sold-out");
    } else {
      slot.classList.remove("sold-out");
      slot.classList.remove("can-buy");

    }
  });

  // 更新ボタンの光りかたなどもチェック
  updateShopVisuals();
}
// 排他ロジックを整理

function handleExclusion(id) {
  let targetId = null;

  // 降る量のペア
  if (id === "spawn_up") targetId = "spawn_down";
  if (id === "spawn_down") targetId = "spawn_up";

  // 運勢のペア（大吉・吉・凶）
  if (id === "luck_daikichi") {
    gameState.itemLevels["luck_kichi"] = Math.max(0, gameState.itemLevels["luck_kichi"] - 1);
    gameState.itemLevels["luck_kyo"] = Math.max(0, gameState.itemLevels["luck_kyo"] - 1);
    applyItemEffect("luck_kichi", gameState.itemLevels["luck_kichi"]);
    applyItemEffect("luck_kyo", gameState.itemLevels["luck_kyo"]);
  }else if (id === "luck_kichi") {
     gameState.itemLevels["luck_daikichi"] = Math.max(0, gameState.itemLevels["luck_daikichi"] - 1);
      gameState.itemLevels["luck_kyo"] = Math.max(0, gameState.itemLevels["luck_kyo"] - 1);
          applyItemEffect("luck_daikichi", gameState.itemLevels["luck_daikichi"]);
    applyItemEffect("luck_kyo", gameState.itemLevels["luck_kyo"]);
    } else if (id === "luck_kyo") {
      gameState.itemLevels["luck_daikichi"] = Math.max(0, gameState.itemLevels["luck_daikichi"] - 1);
      gameState.itemLevels["luck_kichi"] = Math.max(0, gameState.itemLevels["luck_kichi"] - 1);
          applyItemEffect("luck_kichi", gameState.itemLevels["luck_kichi"]);
    applyItemEffect("luck_daikichi", gameState.itemLevels["luck_daikichi"]);
    }
  // ...吉、凶の場合も同様に書く...

  if (targetId) {
    gameState.itemLevels[targetId] = Math.max(0, gameState.itemLevels[targetId] - 1);
    // レベルが下がった方の効果も即座に再計算して反映
    applyItemEffect(targetId, gameState.itemLevels[targetId]);
  }
}

function applyItemEffect(id, level) {
  console.log(`効果適用：${id}, レベル：${level}`);

  switch(id) {
    // 降る量に関連するIDなら、両方のレベルを考慮して間隔を再計算
    case "spawn_up":
    case "spawn_down":
      const upLv = gameState.itemLevels["spawn_up"] || 0;
      const downLv = gameState.itemLevels["spawn_down"] || 0;
      
      // 基本1200ms。アップ1につき-300ms、ダウン1につき+500ms
      // (例: アップLv1, ダウンLv0 => 900ms)
      // (例: アップLv1, ダウンLv1 => 1400ms ※打ち消し合いが起こるのでこのケースは基本ないはず)
      let newInterval = 1200 - (upLv * 300) + (downLv * 500);
      
      // 速すぎ・遅すぎの制限
      gameState.spawnInterval = Math.max(200, Math.min(3000, newInterval));
      
      console.log(`新しい降る間隔: ${gameState.spawnInterval}ms`);
      restartSpawnTimer(); // 即座に新しい間隔で再始動
      break;

    case "money":
      gameState.moneyMultiplier = 1 + (level * 0.5);
      break;
      
    // 運勢系は spawnOmikuji 側がレベルを直接参照するのでここではログのみ
    case "luck_daikichi":
    case "luck_kichi":
    case "luck_kyo":
      break;
  }
}
function resetAllItemLevels() {
  // すべてのアイテムIDを0にリセット
  const ids = ["spawn_up", "spawn_down", "money", "luck_daikichi", "luck_kichi", "luck_kyo"];
  ids.forEach(id => {
    gameState.itemLevels[id] = 0;
  });

  // 倍率や間隔も初期値に戻す
  gameState.moneyMultiplier = 1;
  gameState.spawnInterval = 1200;
  
  console.log("アイテムレベルをすべてリセットしました");
}


const gameScreen = document.getElementById("gameScreen");
const resizeHandle = document.getElementById("resizeHandle");

let isResizing = false;

// --- マウス・タッチ開始 ---
const startResize = (e) => {
  isResizing = true;
  document.body.style.cursor = "ns-resize";
  e.preventDefault();
};

// --- 移動中 ---
const doResize = (e) => {
  if (!isResizing) return;

  // タッチ操作とマウス操作の両方に対応
  const clientY = e.touches ? e.touches[0].clientY : e.clientY;
  
  // gameScreenの上端からの距離を計算して高さに設定
  const rect = gameScreen.getBoundingClientRect();
  const newHeight = clientY - rect.top;

  // 最小・最大制限を守りつつ反映
  if (newHeight > 400 && newHeight < window.innerHeight * 0.98) {
    gameScreen.style.height = newHeight + "px";
  }
};

// --- 終了 ---
const stopResize = () => {
  isResizing = false;
  document.body.style.cursor = "default";
};

// イベント登録
resizeHandle.addEventListener("mousedown", startResize);
resizeHandle.addEventListener("touchstart", startResize);

window.addEventListener("mousemove", doResize);
window.addEventListener("touchmove", doResize, { passive: false });

window.addEventListener("mouseup", stopResize);
window.addEventListener("touchend", stopResize);
</script>
