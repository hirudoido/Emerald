<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>緑玉神社</title>
  <style>
body, #gameScreen, .omikuji {
  user-select: none;
  -webkit-user-select: none;
  -ms-user-select: none;
}
body {
  font-family: sans-serif;
  text-align: center;
  background: #f0f0f0;
  overflow: hidden;
}

/* --- モード選択画面 --- */
#modeSelect {
  margin-top: 100px;
}
button {
  font-size: 24px;
  padding: 10px 30px;
  margin: 10px;
}

/* --- ゲーム画面 --- */
#gameScreen {
  display: none;
  position: relative;
  width: 100%;
  height: 100vh;
  background: #fff;
  overflow: hidden;
  border-top: 3px solid #aaa;
}

#info {
  font-size: 24px;
  padding: 10px;
}

#goodZone, #badZone {
  position: absolute;
  top: 200px;
  width: 40%;
  height: 300px;
  border: 3px dashed #aaa;
  line-height: 300px;
  font-size: 32px;
  font-weight: bold;
}
#badZone { left: 5%; color: purple; }
#goodZone { right: 5%; color: red; }

#plate {
  position: absolute;
  bottom: 80px;
  left: 50%;
  transform: translateX(-50%);
  width: 300px;
  height: 40px;
  background: silver;
  border-radius: 20px;
  text-align: center;
  line-height: 40px;
  font-weight: bold;
  border: 3px solid #aaa;
}

/* --- おみくじ --- */
.omikuji {
  position: absolute;
  width: 120px;
  height: 50px;
  line-height: 50px;
  border-radius: 10px;
  color: #fff;
  font-weight: bold;
  cursor: grab;
  user-select: none;
}
.good { background: red; }
.bad  { background: purple; }
  </style>
</head>
<body>

<!-- モード選択画面 -->
<div id="modeSelect">
  <h1>モードを選択</h1>
  <button id="startBtn">スタート</button>
</div>

<!-- ゲーム画面 -->
<div id="gameScreen">
  <div id="info">残り時間：<span id="time">30</span>　入れた数：<span id="score">0</span></div>

  <div id="badZone">悪い</div>
  <div id="goodZone">良い</div>
  <div id="plate">皿</div>
</div>

<script>
let timeLeft = 30;
let score = 0;
let gameInterval;
let fallInterval;
let dragging = null;

document.getElementById("startBtn").onclick = () => {
  document.getElementById("modeSelect").style.display = "none";
  document.getElementById("gameScreen").style.display = "block";
  startGame();
};

function startGame() {
  gameInterval = setInterval(() => {
    timeLeft--;
    document.getElementById("time").textContent = timeLeft;
    if (timeLeft <= 0) endGame();
  }, 1000);

  fallInterval = setInterval(spawnOmikuji, 1200);
}

function endGame() {
  clearInterval(gameInterval);
  clearInterval(fallInterval);
  alert("ゲーム終了！ 入れた数：" + score);
}

function spawnOmikuji() {
  const omikuji = document.createElement("div");
  const isGood = Math.random() < 0.5;

  omikuji.className = "omikuji " + (isGood ? "good" : "bad");
  omikuji.textContent = isGood ? "大吉" : "大凶";

  // ★ 中央40%〜60%の範囲に落とす
  const minX = window.innerWidth * 0.3;
  const maxX = window.innerWidth * 0.7;
  omikuji.style.left = (minX + Math.random() * (maxX - minX)) + "px";
  omikuji.style.top = "-60px";

  document.getElementById("gameScreen").appendChild(omikuji);

  let fallSpeed = 2 + Math.random() * 3;

  const fall = setInterval(() => {
    if (dragging === omikuji) return;

    let top = parseFloat(omikuji.style.top);
    omikuji.style.top = top + fallSpeed + "px";

    // ★ 皿に乗ったか判定
    if (checkPlate(omikuji, fall)) return;

    if (top > window.innerHeight) {
      clearInterval(fall);
      omikuji.remove();
    }
  }, 16);

  // --- 掴む処理 ---
 omikuji.onmousedown = (e) => {
  e.preventDefault();
  dragging = omikuji;
  omikuji.style.cursor = "grabbing";

  const shiftX = e.clientX - omikuji.getBoundingClientRect().left;
  const shiftY = e.clientY - omikuji.getBoundingClientRect().top;

  function moveAt(x, y) {
    omikuji.style.left = x - shiftX + "px";
    omikuji.style.top = y - shiftY + "px";
  }

  function onMouseMove(e) {
    moveAt(e.clientX, e.clientY);
  }

  document.addEventListener("mousemove", onMouseMove);

  // ★ 重要：document 全体で mouseup を拾う
  function onMouseUp() {
    document.removeEventListener("mousemove", onMouseMove);
    document.removeEventListener("mouseup", onMouseUp);

    omikuji.style.cursor = "grab";
    dragging = null;

    checkDrop(omikuji);
  }

  document.addEventListener("mouseup", onMouseUp);
};
}

// --- 良い・悪いゾーンの判定 ---
function checkDrop(omikuji) {
  const rect = omikuji.getBoundingClientRect();
  const good = document.getElementById("goodZone").getBoundingClientRect();
  const bad = document.getElementById("badZone").getBoundingClientRect();

  const isGood = omikuji.classList.contains("good");

  if (isOverlap(rect, good) && isGood) {
    score++;
    document.getElementById("score").textContent = score;
    omikuji.remove();
  } else if (isOverlap(rect, bad) && !isGood) {
    score++;
    document.getElementById("score").textContent = score;
    omikuji.remove();
  }
}

function isOverlap(a, b) {
  return !(a.right < b.left || a.left > b.right || a.bottom < b.top || a.top > b.bottom);
}

// --- 皿の判定 ---
function checkPlate(omikuji, fall) {
  const plate = document.getElementById("plate").getBoundingClientRect();
  const rect = omikuji.getBoundingClientRect();

  const centerX = rect.left + rect.width / 2;
  const centerY = rect.top + rect.height / 2;

  const onPlate =
    centerX > plate.left &&
    centerX < plate.right &&
    centerY > plate.top &&
    centerY < plate.bottom;

  if (onPlate) {
    clearInterval(fall);
    omikuji.style.top = (plate.top - rect.height) + "px";
    return true;
  }
  return false;
}
</script>

</body>
</html>
