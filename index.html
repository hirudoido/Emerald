<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>緑玉神社</title>
<style>
/* --- 1. デバイス全体の固定設定 --- */
body {
  margin: 0;
  padding: 0;
  background: #000;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  width: 100vw;
  overflow: hidden; /* スクロール禁止 */
  position: fixed;  /* スマホのバウンス禁止  */
  touch-action: none; /* ブラウザ操作を無効化  */
}

/* --- 2. ゲーム画面の比率固定 --- */
#gameScreen {
  position: relative;
  aspect-ratio: 9 / 17;
  height: 95vh;     /* 画面の高さに合わせる */
  width: auto;
  max-width: 100vw;
  background: #fff;
  overflow: hidden; 
  border-radius: 10px;
  touch-action: none; /* ゲーム内操作を優先 [cite: 6] */
}

/* --- 3. 判定ゾーンのレスポンシブ化 --- */
/* --- 判定ゾーンをサッカーゴール風に --- */
/* --- 判定ゾーンをデバイス幅に左右されず端に固定 --- */
#badZone, #goodZone {
  position: absolute;
  bottom: 35%;
  width: 28%;          /* 画面幅の28%に固定 */
  height: 20%;         /* 高さも%にすると縦長デバイスでも安定します */
  border: 4px solid;
  border-bottom: none; 
  background: rgba(255, 255, 255, 0.2);
  z-index: 5;
}

#badZone { 
  left: -12%;             /* 左端にぴったり配置 */
  border-color: purple; 
  border-left: none;   /* 左側の線を消すとよりゴールっぽくなります */
  transform: rotate(-10deg);
  transform-origin: left bottom; /* 左下を軸に回転 */
}

#goodZone { 
  right: -12%;            /* 右端にぴったり配置 */
  border-color: red; 
  border-right: none;  /* 右側の線を消す */
  transform: rotate(10deg);
  transform-origin: right bottom; /* 右下を軸に回転 */
}
/* --- 4. 皿の位置を固定 --- */
#plate {
  position: absolute;
  bottom: 30%;
  left: 50%;
  transform: translateX(-50%);
  width: 55%;           /* 少し幅を広めに */
  height: 5%;         /* 台座の厚み */
  background: linear-gradient(to bottom, #e0e0e0, #bdbdbd); /* 前面のグラデーション */
  border-radius: 4px;
  z-index: 6;
  box-shadow: 0 10px 20px rgba(0,0,0,0.3); /* 下に落とす影 */
}
/* 台座の「上面（奥行き部分）」 */
#plate::before {
  content: "";
  position: absolute;
  top: -15px;           /* 厚みの分だけ上に配置 */
  left: 0;
  width: 100%;
  height: 15px;
  background: #824242;  /* 上面は光が当たって明るい色 */
  border-radius: 4px 4px 0 0;
  transform: perspective(100px) rotateX(40deg); /* 奥行きを出すマジック */
}

/* 台座の「脚（下の支え部分）」 */
#plate::after {
  content: "皿";       /* 文字を入れる場合はここ */
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
  color: #757575;
  position: absolute;
  bottom: -100%;
  left: 15%;
  width: 70%;
  height: 100%;
  background: #9e9e9e;
  clip-path: polygon(10% 0%, 90% 0%, 100% 100%, 0% 100%); /* 台形にする */
}
/* --- おみくじのサイズも調整 --- */
/* --- おみくじのサイズ固定 --- */
.omikuji {
  position: absolute;
  width: 11%;          /* 画面幅の22%に固定 */
  aspect-ratio: 1 / 1.5; /* おみくじ画像が縦長なら 1 / 2 に調整 */
  z-index: 10;
  touch-action: none;
  background-size: contain;
  background-repeat: no-repeat;
  background-position: center;
  /* テキストを表示しない場合は以下を追加 */
  text-indent: -9999px;
}
/* 文字選択と長押しメニューを完全に禁止 */
* {
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
}
.omikuji {
  /* ドラッグしやすくするため、タッチ時の挙動を制限 */
  touch-action: none;
  cursor: grab;
  /* 色が赤に固定されていたので、クラスで指定できるように変更 */
}
.good { background-color: #ff4444; }
.bad { background-color: #4444ff; }


#gameScreen {
  position: relative;
  aspect-ratio: 9 / 17; /* 比率を9:17に固定  */
  height: 95vh;
  background: #fff;
  overflow: hidden;
  border-radius: 10px;
}

#modeSelect {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-color: #ffccaa; /* お手本に近いオレンジ色 */
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  z-index: 100;
}

.menu-container {
  display: flex;
  flex-direction: column;
  gap: 20px;
  width: 80%;
}

.menu-btn {
  padding: 15px 0;
  font-size: 1.2rem;
  font-weight: bold;
  background: #fff;
  border: 2px solid #2e7d32; /* 緑の枠線 */
  border-radius: 8px;
  cursor: pointer;
}
  /* --- おみくじの情報表示 --- */
#info {
  /* 親の #gameScreen を基準にする */
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 6%; /* 少し高さを出すとバランスが良いです */
  display: flex;
  justify-content: space-around;
  align-items: center;
  background: rgba(0, 0, 0, 0.7); /* 少し濃いめの半透明黒 */
  color: #fff;
  z-index: 110; /* モード選択や皿よりも上に表示 */
  border-bottom: 2px solid #ffcc00; /* 下に金色の線を引くと神社っぽくなります */
}

/* 各項目の調整 */
.info-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  flex: 1;
}

.label {
  font-size: 2%;
  color: #ffcc00;
  font-weight: bold;
}

#time, #money, #score {
  font-family: 'Courier New', Courier, monospace; /* 数字を等幅にするとガタつきません */
}
</style>
</head>
<body>
<div id="gameScreen">
  <div id="info" style="display:none;">
    <div class="info-item">
      <span class="label">￥</span>
      <span id="money">0</span>
    </div>
    <div class="info-item timer">
      <span id="time">30</span>
    </div>
    <div class="info-item">
      <span class="label">数</span>
      <span id="score">0</span>
    </div>
  </div>
<!-- モード選択画面 -->

  <div id="modeSelect">
    <div class="menu-container">
      <button class="menu-btn">エンドレス</button>
      <button id="startBtn" class="menu-btn">スタート</button>
      <button class="menu-btn">今はなし</button>
    </div>
  </div>


  <div id="badZone" style="display:none;">悪い</div>
  <div id="goodZone" style="display:none;">良い</div>
  <div id="plate" style="display:none;"></div>
</div>

<script>
  // ==========================================
//   ゲームバランス調整用パラメータ
// ==========================================
// --- ゲームバランス調整用 ---
const PARAMS = {
  gravity: 0.5,          // 重力（落下の加速速度）
  maxFallSpeed: 7,        // 最大落下速度（リミッター）
  friction: 0.99,         // 空気抵抗（はじいた後の減速比。1に近づくほど止まらない）
  tossPower: 1.0005,         // はじく強さの倍率
  bounceLimit: -0.1,      // 壁に当たった時の跳ね返り係数
  spawnInterval: 100,    // おみくじが出てくる間隔（ミリ秒）
  gameTime: 30            // 制限時間（秒）
};

// 内部管理用変数
let timeLeft = PARAMS.gameTime;
let score = 0;
let gameInterval;
let fallInterval;
let dragging = null;

document.getElementById("startBtn").onclick = () => {
  document.getElementById("modeSelect").style.display = "none";
  
  // info を block ではなく flex で表示させる
  const info = document.getElementById("info");
  info.style.display = "flex"; 
  
  // 他の要素を表示
  document.getElementById("badZone").style.display = "block";
  document.getElementById("goodZone").style.display = "block";
  document.getElementById("plate").style.display = "block";
  
  startGame();
};

function startGame() {
  gameInterval = setInterval(() => {
    timeLeft--;
    document.getElementById("time").textContent = timeLeft;
    if (timeLeft <= 0) endGame();
  }, 1000);

  fallInterval = setInterval(spawnOmikuji, 1200);
}

function endGame() {
  clearInterval(gameInterval);
  clearInterval(fallInterval);
  alert("ゲーム終了！ 入れた数：" + score);
}

function spawnOmikuji() {
  const gameScreen = document.getElementById("gameScreen");
  const omikuji = document.createElement("div");

  // 1. おみくじの中身とクラスを設定 
  const isGood = Math.random() < 0.5;
  omikuji.className = "omikuji " + (isGood ? "good" : "bad");
  omikuji.textContent = isGood ? "大吉" : "大凶";

// --- 【ここを画像に差し替え】 ---
  if (isGood) {
    omikuji.style.backgroundImage = "url('daikichi.jpg')"; // 大吉の画像パス
  } else {
    omikuji.style.backgroundImage = "url('daikyo.png')";   // 大凶の画像パス
  }
  // 2. 画面に追加（サイズ取得のために先にappendする） 
  gameScreen.appendChild(omikuji);

  // 3. レスポンシブな初期位置計算
  // 画面幅からおみくじ自身の幅を引いて、はみ出さないように配置 
// --- おみくじの出現範囲を中央に制限 ---
const screenWidth = gameScreen.clientWidth;
const oWidth = omikuji.offsetWidth || (screenWidth * 0.22);

// 画面の左右25%ずつを禁止エリアにし、中央の50%の範囲内だけでランダムにします
const minLeft = screenWidth * 0.3; // 左端から25%の位置
const maxLeft = screenWidth * 0.75 - oWidth; // 右端から25%を引いた位置

omikuji.style.left = (Math.random() * (maxLeft - minLeft) + minLeft) + "px";
omikuji.style.top = "-100px"; // 画面の外から降らせる
  let vx = 0; // 横速度
  let vy = 0; // 縦速度
  let isOnPlate = false;

  const fall = setInterval(() => {
    if (dragging === omikuji || isOnPlate) return;

    // 重力計算（PARAMSを使用） 
    vy += PARAMS.gravity;
    if (vy > PARAMS.maxFallSpeed) vy = PARAMS.maxFallSpeed;
    
    // 座標更新
    let x = parseFloat(omikuji.style.left) + vx;
    let y = parseFloat(omikuji.style.top) + vy;

    // 壁バウンド（画面幅に合わせて動的に判定） 
    if (x < 0) {
      x = 0;
      vx *= PARAMS.bounceLimit;
    } else if (x > screenWidth - oWidth) {
      x = screenWidth - oWidth;
      vx *= PARAMS.bounceLimit;
    }

    omikuji.style.left = x + "px";
    omikuji.style.top = y + "px";

    // 速度減衰（慣性） 
    vx *= PARAMS.friction;

    // 皿判定 
    if (checkPlate(omikuji)) {
      isOnPlate = true;
      vx = 0; vy = 0;
    }

    // ゴール判定 
    checkDrop(omikuji);

    // 画面外削除
    if (y > gameScreen.clientHeight) {
      clearInterval(fall);
      omikuji.remove();
    }
  }, 16);

  // --- ドラッグ＆はじく処理（中心点ズレ修正版） ---
  omikuji.onpointerdown = (e) => {
    e.preventDefault();
    dragging = omikuji;
    isOnPlate = false;
    omikuji.setPointerCapture(e.pointerId);

    let lastX = e.clientX;
    let lastY = e.clientY;

    const move = (ev) => {
      if (dragging !== omikuji) return;
      
      // 速度計算 
      vx = (ev.clientX - lastX) * PARAMS.tossPower;
      vy = (ev.clientY - lastY) * PARAMS.tossPower;
      lastX = ev.clientX;
      lastY = ev.clientY;

      const sRect = gameScreen.getBoundingClientRect();
      
      // 指の真ん中におみくじが来るように計算 
      omikuji.style.left = (ev.clientX - sRect.left - (omikuji.offsetWidth / 2)) + "px";
      omikuji.style.top = (ev.clientY - sRect.top - (omikuji.offsetHeight / 2)) + "px";
    };

    const up = () => {
      document.removeEventListener("pointermove", move);
      document.removeEventListener("pointerup", up);
      dragging = null;
    };
    
    document.addEventListener("pointermove", move);
    document.addEventListener("pointerup", up);
  };
}
// --- 良い・悪いゾーンの判定 ---
let money = 0; // お金の変数を追加

function checkDrop(omikuji) {
  const rect = omikuji.getBoundingClientRect();
  const good = document.getElementById("goodZone").getBoundingClientRect();
  const bad = document.getElementById("badZone").getBoundingClientRect();
  const isGood = omikuji.classList.contains("good");

  // 判定ロジック
  if ((isOverlap(rect, good) && isGood) || (isOverlap(rect, bad) && !isGood)) {
    // スコア加算
    score++;
    document.getElementById("score").textContent = score;

    // お金加算（1回につき5円など）
    money += 5;
    document.getElementById("money").textContent = money;

    // 演出：消えるときのエフェクトなどをここに追加
    omikuji.remove();
  }
}

function isOverlap(a, b) {
  return !(a.right < b.left || a.left > b.right || a.bottom < b.top || a.top > b.bottom);
}

// --- 皿の判定 ---
// 皿判定の修正（タイマーを止めずに、乗っているフラグを返すだけにする）
function checkPlate(omikuji) {
  const plate = document.getElementById("plate").getBoundingClientRect();
  const rect = omikuji.getBoundingClientRect();
  const centerX = rect.left + rect.width / 2;
  const centerY = rect.bottom; // おみくじの下端で判定

  const onPlate =
    centerX > plate.left &&
    centerX < plate.right &&
    centerY >= plate.top &&
    centerY <= plate.bottom;

  if (onPlate) {
    // 皿の表面にピタッと合わせる
    const screenRect = document.getElementById("gameScreen").getBoundingClientRect();
    omikuji.style.top = (plate.top - screenRect.top - rect.height) + "px";
    return true;
  }
  return false;
}
</script>

</body>
</html>
